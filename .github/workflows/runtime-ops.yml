name: Runtime Ops Assets

on:
  # NO paths: filter on purpose. This job is a ~1-min hermetic invariant validator
  # (pip install + a few pytest files + promtool). A paths: allowlist is a SECOND copy
  # of "which files the guards read" and necessarily drifts from verify_runtime_assets.py
  # + the guard tests — e.g. a guard reads scripts/sync_to_aliyun.sh / Dockerfile /
  # docker-compose.ghcr.yml, none of which were in the old allowlist, so a change that
  # broke the guarded invariant ran NEITHER workflow (dormant authority / green-by-omission).
  # Running unconditionally on main/dev kills that whole class instead of chasing paths.
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 3 * * 1"

jobs:
  runtime-assets:
    name: Runtime Asset Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install runtime validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt pytest pytest-asyncio

      - name: Install promtool (pinned)
        run: |
          set -euo pipefail
          PROM_VERSION=2.53.1
          curl -fsSL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: Validate runtime asset suite
        run: |
          python scripts/verify_runtime_assets.py
          pytest -q \
            tests/scripts/test_runtime_backup_restore.py \
            tests/scripts/test_runtime_assets.py
          # NOTE: tests/scripts/test_aliyun_deploy_scripts.py is intentionally NOT wired
          # here yet. It is hermetic but currently RED against the evolved deploy scripts
          # (asserts a tmp REMOTE_DIR succeeds, but validate_aliyun_release_env.sh now
          # enforces the canonical /root/deeptutor target) — a separate dormant-test-rot
          # to remediate before it can gate CI. Wiring a red suite here would block all PRs.

      - name: Validate + behaviorally test Prometheus alert rules
        run: |
          # check rules = syntax/expr validity; test rules = fire/no-fire behavior
          # (catches a typo'd expr that never fires — which check rules cannot).
          promtool check rules deployment/observability/prometheus.alerts.example.yml
          promtool test rules deployment/observability/prometheus.alerts.test.yml
