name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "scripts/check_contract_guard.py"
      - "scripts/check_turn_contract_guard.py"
      - "scripts/ci/check_websocket_route_allowlist.py"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "CONTRACT.md"
      - "AGENTS.md"
      - "contracts/**"
      - "web/**"
      - "wx_miniprogram/**"
      - "yousenwebview/**"
      - "deployment/**"
      - "docker-compose.yml"
      - "docs/zh/guide/unified-turn-contract.md"
      - ".github/workflows/tests.yml"
      - ".github/pull_request_template.md"
      - "scripts/ci/check_secure_routers.sh"
      - "scripts/ci/baselines/secure_routers_baseline.txt"
      - "supabase/migrations/**"
      - "scripts/ci/check_rls_on_create_table.sh"
      - "scripts/ci/baselines/rls_migrations_baseline.txt"
      - "scripts/ci/check_live_rls_regression.sh"
      - "scripts/ci/live_rls_audit.sh"
      - "docs/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "scripts/check_contract_guard.py"
      - "scripts/check_turn_contract_guard.py"
      - "scripts/ci/check_websocket_route_allowlist.py"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "CONTRACT.md"
      - "AGENTS.md"
      - "contracts/**"
      - "web/**"
      - "wx_miniprogram/**"
      - "yousenwebview/**"
      - "deployment/**"
      - "docker-compose.yml"
      - "docs/zh/guide/unified-turn-contract.md"
      - ".github/workflows/tests.yml"
      - ".github/pull_request_template.md"
      - "scripts/ci/check_secure_routers.sh"
      - "scripts/ci/baselines/secure_routers_baseline.txt"
      - "supabase/migrations/**"
      - "scripts/ci/check_rls_on_create_table.sh"
      - "scripts/ci/baselines/rls_migrations_baseline.txt"
      - "scripts/ci/check_live_rls_regression.sh"
      - "scripts/ci/live_rls_audit.sh"
      - "docs/**"

jobs:
  contract-guard:
    name: Contract Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install contract guard dependencies
        run: |
          python -m pip install --upgrade pip
          # pydantic is required because scripts/check_contract_guard.py's
          # evaluate_emitted_error_codes() imports deeptutor.contracts, whose
          # __init__.py transitively imports modules that use pydantic models.
          pip install "PyYAML>=6.0" "pydantic>=2"

      - name: Run contract guard
        run: |
          python scripts/check_contract_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

      - name: WebSocket single-control-plane allowlist gate
        # Reflects the live FastAPI app's production WebSocket surface and fails
        # on any WS route not declared in contracts/index.yaml websocket_routes,
        # or any second chat WS (turn.md:22). Reflection needs server deps; the
        # contract-guard step above degrades to a skip-with-note when they are
        # absent, so this step is the load-bearing enforcement.
        run: |
          pip install -r requirements/server.txt
          python scripts/ci/check_websocket_route_allowlist.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Secure router fail-on-new gate
        run: FAIL_ON_NEW=1 bash scripts/ci/check_secure_routers.sh

      - name: RLS fail-on-new gate
        run: FAIL_ON_NEW=1 bash scripts/ci/check_rls_on_create_table.sh

      - name: Rate limit single-authority gate
        run: bash scripts/ci/check_rate_limit_single_authority.sh

      - name: LLM client factory gate
        run: bash scripts/ci/check_llm_client_factory.sh

      - name: Runtime safety wiring gate
        run: bash scripts/ci/check_runtime_safety_usage.sh

      - name: Migration uniqueness gate
        run: bash scripts/ci/check_migration_uniqueness.sh

      - name: Live RLS regression gate
        # Skips with a warning when SUPABASE_DB_URL is not configured (forks /
        # missing secret), so a missing credential never blocks CI. When the
        # secret is present, it fails on any monitored PII table that still
        # grants anon/authenticated (regression guard for the P5 hardening).
        run: bash scripts/ci/check_live_rls_regression.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  import-check:
    name: Import Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: contract-guard
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install minimal dependencies for import check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt

      - name: Check module imports
        run: |
          echo "🐍 Testing with Python ${{ matrix.python-version }}"
          python -c "from deeptutor.runtime.orchestrator import ChatOrchestrator; print('✅ Orchestrator imports OK')"
          python -c "from deeptutor.runtime.registry.tool_registry import get_tool_registry; print('✅ Tool registry imports OK')"
          python -c "from deeptutor.runtime.registry.capability_registry import get_capability_registry; print('✅ Capability registry imports OK')"
          python -c "from deeptutor.services.config.env_store import EnvStore; print('✅ EnvStore imports OK')"
          python -c "from deeptutor.api.routers.unified_ws import unified_websocket; print('✅ Unified WS imports OK')"
          python -c "from deeptutor.services.prompt.manager import PromptManager; print('✅ Prompt manager imports OK')"
          python -c "from deeptutor.logging import get_logger; print('✅ Logging imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  smoke-tests:
    name: Full Test Tree (Python 3.11)
    runs-on: ubuntu-latest
    needs: import-check

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install pytest pytest-asyncio

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML

      - name: Run hermetic full test tree
        run: |
          # M9 → L3/L4: the required gate now runs the WHOLE tests/ tree, not a
          # hand-picked allowlist, so no directory can silently go un-run. Tests
          # that need a real external service or host layout are isolated behind
          # explicit markers (requires_external) and tests broken by in-flight
          # parallel work are quarantined (quarantine_web_drift /
          # quarantine_assessment_drift). Everything else is hermetic and gates.
          #
          # No silent caps: count and print exactly what is excluded so the
          # exclusion is visible in the log and the step summary, never silent.
          EXCLUDE='not requires_external and not quarantine_web_drift and not quarantine_assessment_drift'
          ext=$(pytest --collect-only -q -m "requires_external" tests/ 2>/dev/null | grep -c '::' || true)
          qweb=$(pytest --collect-only -q -m "quarantine_web_drift" tests/ 2>/dev/null | grep -c '::' || true)
          qasmt=$(pytest --collect-only -q -m "quarantine_assessment_drift" tests/ 2>/dev/null | grep -c '::' || true)
          {
            echo "### Hermetic full-tree gate — explicit exclusions";
            echo "| Marker | Excluded from gate | Why |";
            echo "|--------|--------------------|-----|";
            echo "| requires_external | ${ext} | needs live Supabase / network / .venv subprocess |";
            echo "| quarantine_web_drift | ${qweb} | broken by parallel BI/web work (advisory job) |";
            echo "| quarantine_assessment_drift | ${qasmt} | taxonomy-authority drift, owner review (advisory job) |";
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Hermetic gate excludes ${ext} requires_external + ${qweb} quarantine_web_drift + ${qasmt} quarantine_assessment_drift test(s); all are run/reported in their own jobs, never silently skipped."
          echo "🧪 Running hermetic full test tree (excluding the markers above)"
          pytest -q --import-mode=importlib -m "$EXCLUDE" tests/
        env:
          PYTHONPATH: ${{ github.workspace }}

  quarantine-advisory:
    name: Quarantined Tests (advisory)
    runs-on: ubuntu-latest
    needs: import-check
    # ADVISORY ONLY — deliberately NOT in the test-summary required gate. It
    # executes and reports the quarantined tests so the drift stays visible
    # (never silently skipped), but a red result here does not block merge.
    # These tests un-quarantine (markers removed) once their owners fix the
    # underlying drift; see docs/plan/2026-05-30-smoke-full-tree-quarantine-backlog.md.

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install pytest pytest-asyncio

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML

      - name: Run quarantined tests (advisory, non-gating)
        run: |
          echo "⚠️ Advisory run of quarantined tests — visible but NON-blocking."
          echo "Required gate stays green; un-quarantine after the owner fixes the drift."
          echo "Backlog: docs/plan/2026-05-30-smoke-full-tree-quarantine-backlog.md"
          pytest -q --import-mode=importlib \
            -m "quarantine_web_drift or quarantine_assessment_drift" tests/
        env:
          PYTHONPATH: ${{ github.workspace }}

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: contract-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend checks
        working-directory: web
        run: |
          npm run lint
          ./node_modules/.bin/tsc -p tsconfig.json --noEmit
          npm run build:perf

  wx-checks:
    name: WX Checks
    runs-on: ubuntu-latest
    needs: contract-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check Mini Program JS
        run: |
          find wx_miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Mini Program regression scripts
        run: |
          node wx_miniprogram/tests/test_mcq_detect.js
          node wx_miniprogram/tests/test_markdown.js
          node wx_miniprogram/tests/test_progressive_disclosure_render.js
          node wx_miniprogram/tests/test_answer_leak_attack.js
          node wx_miniprogram/tests/test_ai_message_state.js
          node wx_miniprogram/tests/test_ws_stream_pure_contract.js
          node wx_miniprogram/tests/test_stream_token_boundary.js

  yousen-checks:
    name: Yousen Checks
    runs-on: ubuntu-latest
    needs: contract-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check Yousen Mini Program JS
        run: |
          find yousenwebview -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run full Yousen regression suite
        # yousenwebview is the production yousen (佑森) mini-program front-end;
        # wx_miniprogram tests above are the shadow contract harness only.
        #
        # Runs every yousenwebview/tests/test_*.js file. Stability was
        # measured locally at 3 consecutive clean runs of 62 tests with 0
        # flakes and a 5-6s wallclock; the suite has no network, login
        # state, time dependency, or ordering coupling. Each file is
        # invoked via `node` so future tests get CI coverage automatically
        # — no workflow edit needed. Failures are collected, every test's
        # stdout is grouped in the GitHub Actions log via ::group:: lines
        # for easy triage, and the step exits non-zero with a summary if
        # any file fails.
        run: |
          set -u
          fail_list=""
          total=0
          for t in yousenwebview/tests/test_*.js; do
            name="$(basename "$t" .js)"
            total=$((total + 1))
            echo "::group::yousen $name"
            if node "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              fail_list="${fail_list}${fail_list:+ }${name}"
            fi
          done
          if [ -n "$fail_list" ]; then
            echo "::error::Yousen suite: $(echo "$fail_list" | tr ' ' '\n' | wc -l | tr -d ' ') of $total tests failed"
            echo "Failed tests:"
            for n in $fail_list; do echo "  - $n"; done
            exit 1
          fi
          echo "Yousen suite: $total/$total tests passed"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: pip install "bandit[toml]" pip-audit

      # bandit reuses the repo's pyproject [tool.bandit] config (same as the local
      # pre-commit hook). ADVISORY for now: a full-tree -ll scan surfaces ~41
      # pre-existing findings (B310 url-open / B324 SHA1 / B608 SQL-string, mostly in
      # assessment/grading) that the incremental pre-commit hook never gated. Wiring it
      # report-only first (maturity audit M10) avoids blocking CI on existing debt;
      # triage the findings (fix real / "# nosec" false positives) then drop
      # continue-on-error to make it a blocking gate.
      - name: Bandit static security scan (advisory)
        continue-on-error: true
        run: bandit -c pyproject.toml -r deeptutor -ll || echo "::warning::bandit surfaced pre-existing findings (advisory until triaged)"

      # pip-audit is advisory for now: deps are unpinned (no lockfile/hash, see
      # maturity audit M10), so a transient upstream CVE should not block CI yet.
      # The local pre-commit hook keeps it disabled (pip-api non-ASCII path bug
      # on Windows) — that bug does not affect Linux CI, so we run it here as warn.
      - name: pip-audit dependency scan (advisory)
        continue-on-error: true
        run: pip-audit --progress-spinner off || echo "::warning::pip-audit found advisories (non-blocking until deps are pinned)"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [contract-guard, import-check, smoke-tests, frontend-checks, wx-checks, yousen-checks, quarantine-advisory]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Contract guard | ${{ needs.contract-guard.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Import check (3.11/3.12) | ${{ needs.import-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Full test tree (3.11, hermetic gate) | ${{ needs.smoke-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend checks | ${{ needs.frontend-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WX checks | ${{ needs.wx-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Yousen checks | ${{ needs.yousen-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quarantined tests (advisory, non-gating) | ${{ needs.quarantine-advisory.result == 'success' && '✅ Passed' || '⚠️ Drift present (non-blocking)' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: needs.contract-guard.result == 'failure' || needs.import-check.result == 'failure' || needs.smoke-tests.result == 'failure' || needs.frontend-checks.result == 'failure' || needs.wx-checks.result == 'failure' || needs.yousen-checks.result == 'failure'
        run: exit 1
