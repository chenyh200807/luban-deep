name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "scripts/check_contract_guard.py"
      - "scripts/check_turn_contract_guard.py"
      - "scripts/ci/check_websocket_route_allowlist.py"
      # Governance scanners (schema/db/env/provider/process/REST registry guards):
      # glob so a scanner-only PR still triggers the guards, and future scanners are
      # covered without re-editing this filter. Codex round: the gate must protect
      # its own scanners, not only the code they govern.
      - "scripts/check_*.py"
      - "scripts/ci/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "CONTRACT.md"
      - "AGENTS.md"
      - "agent-skills/**"
      - ".secrets.baseline"
      - ".bandit-baseline.json"
      - "contracts/**"
      - "artifacts/luban_case_family_assets/diagram_microlesson/finished/**/*practice*.dc.html"
      # eval/ hosts the harness_authority single-authority gate (eval/gates.yaml);
      # a change there must trigger Tests so the gate cannot drift untested.
      - "eval/**"
      - "web/**"
      - "wx_miniprogram/**"
      - "yousenwebview/**"
      - "deployment/**"
      - "docker-compose.yml"
      - "docs/zh/guide/unified-turn-contract.md"
      - ".github/workflows/tests.yml"
      - ".github/pull_request_template.md"
      - "scripts/ci/check_secure_routers.sh"
      - "scripts/ci/baselines/secure_routers_baseline.txt"
      - "scripts/ci/baselines/submission_relation_gates_baseline.txt"
      - "supabase/migrations/**"
      - "scripts/ci/check_rls_on_create_table.sh"
      - "scripts/ci/baselines/rls_migrations_baseline.txt"
      - "scripts/ci/check_live_rls_regression.sh"
      - "scripts/ci/live_rls_audit.sh"
      - "docs/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "scripts/check_contract_guard.py"
      - "scripts/check_turn_contract_guard.py"
      - "scripts/ci/check_websocket_route_allowlist.py"
      # Governance scanners (schema/db/env/provider/process/REST registry guards):
      # glob so a scanner-only PR still triggers the guards, and future scanners are
      # covered without re-editing this filter. Codex round: the gate must protect
      # its own scanners, not only the code they govern.
      - "scripts/check_*.py"
      - "scripts/ci/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "CONTRACT.md"
      - "AGENTS.md"
      - "agent-skills/**"
      - ".secrets.baseline"
      - ".bandit-baseline.json"
      - "contracts/**"
      - "artifacts/luban_case_family_assets/diagram_microlesson/finished/**/*practice*.dc.html"
      # eval/ hosts the harness_authority single-authority gate (eval/gates.yaml);
      # a change there must trigger Tests so the gate cannot drift untested.
      - "eval/**"
      - "web/**"
      - "wx_miniprogram/**"
      - "yousenwebview/**"
      - "deployment/**"
      - "docker-compose.yml"
      - "docs/zh/guide/unified-turn-contract.md"
      - ".github/workflows/tests.yml"
      - ".github/pull_request_template.md"
      - "scripts/ci/check_secure_routers.sh"
      - "scripts/ci/baselines/secure_routers_baseline.txt"
      - "scripts/ci/baselines/submission_relation_gates_baseline.txt"
      - "supabase/migrations/**"
      - "scripts/ci/check_rls_on_create_table.sh"
      - "scripts/ci/baselines/rls_migrations_baseline.txt"
      - "scripts/ci/check_live_rls_regression.sh"
      - "scripts/ci/live_rls_audit.sh"
      - "docs/**"
  merge_group:
    types: [checks_requested]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change Scope
    runs-on: ubuntu-latest
    outputs:
      governance: ${{ steps.scope.outputs.governance }}
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      wx: ${{ steps.scope.outputs.wx }}
      yousen: ${{ steps.scope.outputs.yousen }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/ci/tests_workflow_scope.py classify \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  contract-guard:
    name: Contract Guard
    runs-on: ubuntu-latest
    needs: change-scope
    if: github.event_name == 'push' || needs.change-scope.outputs.governance == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install contract guard dependencies
        run: |
          python -m pip install --upgrade pip
          # pydantic is required because scripts/check_contract_guard.py's
          # evaluate_emitted_error_codes() imports deeptutor.contracts, whose
          # __init__.py transitively imports modules that use pydantic models.
          pip install "PyYAML>=6.0" "pydantic>=2"

      - name: NameError gate (ruff F821 undefined name + F811 redefinition)
        # Single-point defense against the whole NameError class (F821) and
        # silent redefinitions (F811) reaching main. Python has no general lint
        # gate in CI — ruff only runs in opt-in local pre-commit — so cold-path
        # NameErrors (missing `import os`/`Path`/`sys`, unresolved annotations)
        # could land undetected. Scoped to F821,F811 ONLY: the repo carries
        # ~300 other intentionally-relaxed lint findings (pyproject [tool.ruff]
        # select=E,F,I but ignores E501/F841/etc.), so a broader gate could not
        # land. Uses the repo's pyproject [tool.ruff] config automatically.
        run: |
          pip install ruff
          ruff check --select F821,F811 deeptutor deeptutor_cli scripts

      - name: Run contract guard
        run: |
          python scripts/check_contract_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

      - name: Schema registry guard (register-before-use closure)
        # Powers on contracts/schema_registry.yaml: every schema-version id in the
        # codebase must be registered (T1 grading typed object / T2 runtime-consumed
        # contract) or match the T3 ephemeral carve-out. --closure regenerates the
        # full id set and fails on any orphan, so no agent can introduce an
        # unregistered schema without updating the single canonical registry.
        # (Bundling into check_contract_guard.py main() is a later consolidation,
        # blocked only by that file's in-flight WIP; this step makes the gate live now.)
        run: |
          python scripts/check_schema_registry.py --closure

      - name: DB registry guard (no unregistered DB connection / write / url)
        # Powers on contracts/db_registry.yaml: a raw psycopg connection, a write
        # to a table, or a *_DB_URL env not declared in the registry fails CI —
        # stops the bleeding on the ad-hoc-connection class that caused the
        # two-Supabase-project surprise (all 15 existing sites are grandfathered).
        # Full-repo scan (scanner self-scopes to psycopg files). ``--all`` runs the
        # scanner's OWN git ls-files internally (M2: no unquoted $(…) word-split on a
        # spaced path). Bundling into check_contract_guard.py is a later consolidation
        # blocked by its WIP.
        run: |
          python scripts/check_db_registry.py --all

      - name: env / flag / credential registry guard (no unregistered env / 假灰度)
        # Powers on contracts/env_registry.yaml: a NEW env referenced via
        # os.getenv/os.environ/env_store.get/env_flag that the registry does not
        # list fails CI (rule a, 防新增裸 env), and a NEW env_flag() read of an
        # unregistered name fails CI (rule b, 防假灰度 — a misspelled gray-release
        # flag silently returns env_flag's default, so KB v5 / LUBAN_V1 rollouts
        # would look live but never take effect). All 284 existing references are
        # grandfathered. Full-repo scan. ``--all`` runs the scanner's OWN git ls-files
        # internally (M2: no unquoted $(…) word-split on a spaced path). Bundling into
        # check_contract_guard.py is a later consolidation blocked by its WIP.
        run: |
          python scripts/check_env_registry.py --all

      - name: provider registry guard (no unregistered provider base_url / 第二权威)
        # Powers on contracts/provider_registry.yaml: a NEW hardcoded provider
        # base_url literal at a call site that does not resolve from the canonical
        # registry fails CI (rule a, 防新增旁路 — a scattered endpoint drifts and
        # mis-attributes cost, the deepseek-billing先例), and a NEW provider added
        # to a deprecated registry copy fails CI (rule b, 防第二权威再生 —三套
        # registry 收成一套). All 12 existing bypass sites + the two deprecated
        # copies are grandfathered. Full-repo scan exits 0 today. ``--all`` runs the
        # scanner's OWN git ls-files internally (M2: no unquoted $(…) word-split on a
        # spaced path). Bundling into check_contract_guard.py is a later consolidation
        # blocked by its WIP.
        run: |
          python scripts/check_provider_registry.py --all

      - name: process registry guard (no unregistered cron / always-on daemon)
        # Powers on contracts/process_registry.yaml: a NEW GHA cron schedule in a
        # .github/workflows/*.yml not listed under scheduled_tasks[] (rule a, 防新
        # 增未登记定时任务), or a NEW always-on daemon — a create_task whose result
        # is stored in a persistent holder (self._*task / *.worker_tasks[...]) — at
        # a file not listed under daemons[] (rule b, 防新增未登记长驻进程) fails CI.
        # This is the止血 against the 201.6 GB Next-process class: an AI-agent-owned
        # always-on task that no one registered cannot slip in. Fire-and-forget
        # per-request create_task (result discarded) is deliberately out of scope
        # (zero-false-positive boundary). All 4 cron workflows + 8 daemon files are
        # grandfathered. Full-repo scan exits 0 today. ``--all`` runs the scanner's
        # OWN git ls-files internally over code + workflows (M2: no unquoted $(…)
        # word-split on a spaced path). Bundling into check_contract_guard.py is a
        # later consolidation blocked by its WIP.
        run: |
          python scripts/check_process_registry.py --all

      - name: submission/relation gate authority guard (no new _looks_like_* re-decider)
        # contracts/turn.md §硬约束 24 (Context-Continuity): a turn's submission/relation
        # intent ("is this an answer / which question") must be decided once by the
        # canonical authority (turn_semantic_decision / question_followup single guard).
        # The recurring "切链路丢上下文/失忆" class came from 15+ independent _looks_like_*
        # gates each re-deciding it. This fail-on-new gate freezes the existing 25 (all
        # grandfathered) and blocks a NEW independent gate from landing silently — 止血
        # only; the semantic closure is the runtime migration that collapses the gates
        # onto the single reader (plan doc §剩余迁移).
        run: |
          python scripts/check_submission_relation_gate_authority.py --all

      - name: harness authority guard (single SCENE_COMPOSITION / grounding / force-exact)
        # AGENTS §5.7 single-authority: the eval harness scene-composition / grounding /
        # force-exact decision must have ONE definition. AST-level + alias-proof; it has
        # caught real regressions but ran only locally (eval/gates.yaml) until now — a
        # second authority definition used to land on main with no CI failure.
        run: |
          python scripts/check_harness_authority.py

      - name: model authority guard (single DEFAULT_LLM_MODEL / PROVIDER)
        # AGENTS §5.7 single-authority: DEFAULT_LLM_MODEL / DEFAULT_LLM_PROVIDER must have
        # ONE definition; a second model-default landing on main now fails CI (was PR-blind).
        run: |
          python scripts/check_model_authority.py

      - name: control-plane writer allowlist gate (single turn_semantic_decision / scene / active_object / reveal / visible-output writer)
        # AGENTS §5.7 single-authority: every control-plane write-site (turn_semantic_decision,
        # question_lifecycle_scene, active_object, reveal_*, visible-output RESULT/PROGRESS/ACK)
        # must be declared in contracts/index.yaml control_plane_writers; an unregistered
        # production writer fails CI (register-before-use, AST-based, fail-closed). Both the
        # repo and packaged contracts copies must agree (parity).
        run: |
          python scripts/check_control_plane_writer_allowlist.py --check

      - name: QTPK import-allowlist gate (god-object red line on question_turn_policy.py)
        # QTPK physical-extraction plan S0: deeptutor/services/question_turn_policy.py is a
        # read-only forwarder over the canonical question-turn resolvers. This guard AST-scans
        # its imports and fails (fail-closed) on any import that is not a canonical resolver
        # (semantic_router / question_lifecycle_skills / active_object_builder / question_followup)
        # or stdlib — i.e. any LLM/grading/RAG/learner-state/reveal/terminal/stream/orchestrator/
        # turn_runtime import is rejected so QTPK cannot grow into a god object.
        run: |
          python scripts/check_qtpk_import_allowlist.py --check

      - name: governance registry meta-gate (every scanner cataloged + every pr_gate wired)
        # The roll-up the schema-governance audit found missing: contracts/registries.yaml
        # is the single catalog of every governance scanner + its resource class + where it
        # runs. This gate fails CI if (a) a scripts/check_*.py governance scanner is not
        # cataloged (register-before-use for the gates themselves), or (b) a pr_gate-class
        # scanner is not actually an executed step in this workflow. It is what would have
        # auto-caught harness/model authority + the schema-registry unit tests being dark.
        # Governs the GATE SET without adding a second schema authority (less-is-more).
        run: |
          python scripts/check_registries_meta.py

      - name: WebSocket single-control-plane allowlist gate
        # Reflects the live FastAPI app's production WebSocket surface and fails
        # on any WS route not declared in contracts/index.yaml websocket_routes,
        # or any second chat WS (turn.md:22). Reflection needs server deps; the
        # contract-guard step above degrades to a skip-with-note when they are
        # absent, so this step is the load-bearing enforcement.
        run: |
          pip install -r requirements/server.txt
          python scripts/ci/check_websocket_route_allowlist.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: REST route existence allowlist gate
        # Reflects the live FastAPI app's production HTTP surface and fails on any
        # router MOUNT PREFIX not declared in contracts/index.yaml http_routes.
        # Closes the REST existence gap (the WS guard above already守住 WS; REST
        # only had auth gates + a report-only inventory). Mirrors the WS guard:
        # reflection-based (include_router chains can't bypass it), MOUNT-PREFIX
        # grain (the existence unit — not leaf paths, which the inventory already
        # enumerates for auth), so it does NOT overlap the WS guard or the secure-
        # router gate. server deps are installed by the WS step above; the contract-
        # guard light job degrades to a skip-with-note, so this is the load-bearing
        # enforcement. All 31 production mounts are grandfathered (exits 0 today).
        run: |
          python scripts/ci/check_rest_route_allowlist.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Secure router fail-on-new gate
        run: FAIL_ON_NEW=1 bash scripts/ci/check_secure_routers.sh

      - name: RLS fail-on-new gate
        run: FAIL_ON_NEW=1 bash scripts/ci/check_rls_on_create_table.sh

      - name: Rate limit single-authority gate
        run: bash scripts/ci/check_rate_limit_single_authority.sh

      - name: LLM client factory gate
        run: bash scripts/ci/check_llm_client_factory.sh

      - name: Runtime safety wiring gate
        run: bash scripts/ci/check_runtime_safety_usage.sh

      - name: Migration uniqueness gate
        run: bash scripts/ci/check_migration_uniqueness.sh

      - name: Live RLS regression gate
        # Skips with a warning when SUPABASE_DB_URL is not configured (forks /
        # missing secret), so a missing credential never blocks CI. When the
        # secret is present, it fails on any monitored PII table that still
        # grants anon/authenticated (regression guard for the P5 hardening).
        run: bash scripts/ci/check_live_rls_regression.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  import-check:
    name: Import Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: change-scope
    if: github.event_name == 'push' || needs.change-scope.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install minimal dependencies for import check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt

      - name: Check module imports
        run: |
          echo "🐍 Testing with Python ${{ matrix.python-version }}"
          python -c "from deeptutor.runtime.orchestrator import ChatOrchestrator; print('✅ Orchestrator imports OK')"
          python -c "from deeptutor.runtime.registry.tool_registry import get_tool_registry; print('✅ Tool registry imports OK')"
          python -c "from deeptutor.runtime.registry.capability_registry import get_capability_registry; print('✅ Capability registry imports OK')"
          python -c "from deeptutor.services.config.env_store import EnvStore; print('✅ EnvStore imports OK')"
          python -c "from deeptutor.api.routers.unified_ws import unified_websocket; print('✅ Unified WS imports OK')"
          python -c "from deeptutor.services.prompt.manager import PromptManager; print('✅ Prompt manager imports OK')"
          python -c "from deeptutor.logging import get_logger; print('✅ Logging imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  smoke-shards:
    name: Smoke Tests Shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: change-scope
    if: github.event_name == 'push' || needs.change-scope.outputs.backend == 'true'
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [api-contract, runtime-capability, learner-grading]
    env:
      LANGFUSE_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install pytest pytest-asyncio

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML

      - name: Run smoke shard
        run: |
          echo "🧪 Running smoke shard: ${{ matrix.shard }}"
          # Grading / learner-state / capabilities are launch-critical correctness cores.
          # They must execute in CI so a scoring/learner regression cannot merge undetected
          # (contract-guard only enforces test-file coupling, not execution). tests/services/rag
          # is intentionally excluded: it mixes hermetic units with network-dependent retrieval
          # integration tests (live embedding API / DB host) that a hermetic smoke job must not
          # run; RAG retrieval quality is gated separately by the eval / golden-set baseline.
          case "${{ matrix.shard }}" in
            api-contract)
              python scripts/publish_luban_preview_cards.py --practice-only --check
              pytest -q --import-mode=importlib \
                tests/api \
                tests/cli \
                tests/scripts/test_publish_luban_preview_cards.py \
                tests/scripts/test_schema_registry.py \
                tests/scripts/test_db_registry.py \
                tests/scripts/test_env_registry.py \
                tests/scripts/test_provider_registry.py \
                tests/scripts/test_process_registry.py \
                tests/scripts/test_registries_meta.py \
                tests/scripts/test_contract_guard.py \
                tests/services/luban_lesson/test_practice_html.py
              ;;
            runtime-capability)
              pytest -q --import-mode=importlib \
                tests/services/test_import_smoke.py \
                tests/services/test_app_facade.py \
                tests/services/test_model_catalog.py \
                tests/services/test_bi_metrics.py \
                tests/services/test_path_service.py \
                tests/runtime/test_orchestrator_autoroute.py \
                tests/services/test_render_presentation.py \
                tests/core/test_prompt_parity.py \
                tests/security \
                tests/tools \
                tests/capabilities
              ;;
            learner-grading)
              pytest -q --import-mode=importlib \
                tests/services/memory \
                tests/services/session \
                tests/services/construction_grading \
                tests/services/learner_state
              ;;
            *)
              echo "::error::Unknown smoke shard: ${{ matrix.shard }}"
              exit 1
              ;;
          esac
        env:
          PYTHONPATH: ${{ github.workspace }}

  smoke-tests:
    name: Smoke Tests (Python 3.11)
    runs-on: ubuntu-latest
    needs: [change-scope, smoke-shards]
    if: always() && (github.event_name == 'push' || needs.change-scope.outputs.backend == 'true')

    steps:
      - name: Check smoke shard results
        run: |
          case "${{ needs.smoke-shards.result }}" in
            success)
              echo "All smoke shards passed."
              ;;
            skipped)
              echo "Smoke shards skipped."
              ;;
            *)
              echo "::error::Smoke shard result was ${{ needs.smoke-shards.result }}"
              exit 1
              ;;
          esac

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: change-scope
    if: github.event_name == 'push' || needs.change-scope.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend checks
        working-directory: web
        run: |
          npm run lint
          ./node_modules/.bin/tsc -p tsconfig.json --noEmit
          npm run build:perf

  wx-checks:
    name: WX Checks
    runs-on: ubuntu-latest
    needs: change-scope
    if: github.event_name == 'push' || needs.change-scope.outputs.wx == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check Mini Program JS
        run: |
          find wx_miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Mini Program regression scripts
        run: |
          node wx_miniprogram/tests/test_mcq_detect.js
          node wx_miniprogram/tests/test_markdown.js
          node wx_miniprogram/tests/test_progressive_disclosure_render.js
          node wx_miniprogram/tests/test_answer_leak_attack.js
          node wx_miniprogram/tests/test_ai_message_state.js
          node wx_miniprogram/tests/test_ws_stream_pure_contract.js
          node wx_miniprogram/tests/test_stream_token_boundary.js

  yousen-checks:
    name: Yousen Checks
    runs-on: ubuntu-latest
    needs: change-scope
    if: github.event_name == 'push' || needs.change-scope.outputs.yousen == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check Yousen Mini Program JS
        run: |
          find yousenwebview -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run full Yousen regression suite
        # yousenwebview is the production yousen (佑森) mini-program front-end;
        # wx_miniprogram tests above are the shadow contract harness only.
        #
        # Runs every yousenwebview/tests/test_*.js file. Stability was
        # measured locally at 3 consecutive clean runs of 62 tests with 0
        # flakes and a 5-6s wallclock; the suite has no network, login
        # state, time dependency, or ordering coupling. Each file is
        # invoked via `node` so future tests get CI coverage automatically
        # — no workflow edit needed. Failures are collected, every test's
        # stdout is grouped in the GitHub Actions log via ::group:: lines
        # for easy triage, and the step exits non-zero with a summary if
        # any file fails.
        run: |
          set -u
          fail_list=""
          total=0
          for t in yousenwebview/tests/test_*.js; do
            name="$(basename "$t" .js)"
            total=$((total + 1))
            echo "::group::yousen $name"
            if node "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              fail_list="${fail_list}${fail_list:+ }${name}"
            fi
          done
          if [ -n "$fail_list" ]; then
            echo "::error::Yousen suite: $(echo "$fail_list" | tr ' ' '\n' | wc -l | tr -d ' ') of $total tests failed"
            echo "Failed tests:"
            for n in $fail_list; do echo "  - $n"; done
            exit 1
          fi
          echo "Yousen suite: $total/$total tests passed"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: change-scope
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # BLOCKING: no real dotenv file may ever be tracked. Direct guard against the
      # ".env with live keys committed" failure mode — .env* is gitignored, but an
      # agent using `git add -f` / `git add -A` from a dirty tree could force one in.
      - name: No tracked .env files (BLOCKING)
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.(example|sample|template)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::A dotenv file is tracked by git — it must never be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Install scanners
        run: pip install "bandit[toml]" pip-audit detect-secrets

      # BLOCKING secret scan. The local pre-commit detect-secrets hook is bypassable
      # (and was bypassed — multiple agents push straight to main), so the only reliable
      # guard is server-side CI. detect-secrets-hook exits non-zero only when a tracked
      # file contains a secret NOT already allowlisted in .secrets.baseline — it does not
      # rewrite the baseline, so there is no generated_at churn / false failure. Catches a
      # committed .env or hardcoded key. scripts/ci/tests_workflow_scope.py owns the
      # scan-input filter for generated payloads, binary assets, and runtime-supply data.
      - name: Secret scan changed files (BLOCKING on PR / merge queue)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/ci/tests_workflow_scope.py scan-secrets-changed \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Secret scan full repository (BLOCKING on push)
        if: github.event_name == 'push'
        run: |
          python scripts/ci/tests_workflow_scope.py scan-secrets-full

      # BLOCKING bandit gate for NEW high-severity + high-confidence findings only.
      # `.bandit-baseline.json` pins the 16 pre-existing high-sev findings (assessment/grading
      # debt) so this never blocks on existing code, only on newly introduced HIGH issues
      # (e.g. a fresh os.system / SQL-string / unsafe-deser). Triage the baseline over time
      # and shrink it. The full -ll advisory scan below still surfaces the medium long tail.
      - name: Bandit high-severity gate (BLOCKING — new HIGH/HIGH findings only)
        run: bandit -c pyproject.toml -r deeptutor -lll -iii -b .bandit-baseline.json -q

      # Advisory full-tree -ll scan for the medium-severity long tail (B310/B324/B608).
      - name: Bandit static security scan (advisory)
        continue-on-error: true
        run: bandit -c pyproject.toml -r deeptutor -ll || echo "::warning::bandit surfaced pre-existing findings (advisory until triaged)"

      # pip-audit is advisory for now: deps are unpinned (no lockfile/hash, see
      # maturity audit M10), so a transient upstream CVE should not block CI yet.
      # The local pre-commit hook keeps it disabled (pip-api non-ASCII path bug
      # on Windows) — that bug does not affect Linux CI, so we run it here as warn.
      - name: pip-audit dependency scan (advisory)
        continue-on-error: true
        run: pip-audit --progress-spinner off || echo "::warning::pip-audit found advisories (non-blocking until deps are pinned)"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [change-scope, contract-guard, import-check, smoke-tests, frontend-checks, wx-checks, yousen-checks, security-scan]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scope | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| governance | \`${{ needs.change-scope.outputs.governance }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| backend | \`${{ needs.change-scope.outputs.backend }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | \`${{ needs.change-scope.outputs.frontend }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| wx | \`${{ needs.change-scope.outputs.wx }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| yousen | \`${{ needs.change-scope.outputs.yousen }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          render() {
            case "$2" in
              success) status="✅ Passed" ;;
              skipped) status="⏭️ Skipped" ;;
              failure) status="❌ Failed" ;;
              cancelled) status="⚠️ Cancelled" ;;
              *) status="$2" ;;
            esac
            echo "| $1 | $status |" >> "$GITHUB_STEP_SUMMARY"
          }
          render "Contract guard" "${{ needs.contract-guard.result }}"
          render "Import check (3.11/3.12)" "${{ needs.import-check.result }}"
          render "Smoke tests (3.11)" "${{ needs.smoke-tests.result }}"
          render "Frontend checks" "${{ needs.frontend-checks.result }}"
          render "WX checks" "${{ needs.wx-checks.result }}"
          render "Yousen checks" "${{ needs.yousen-checks.result }}"
          render "Security scan" "${{ needs.security-scan.result }}"

      - name: Fail if required checks failed
        run: |
          results="${{ needs.change-scope.result }} ${{ needs.contract-guard.result }} ${{ needs.import-check.result }} ${{ needs.smoke-tests.result }} ${{ needs.frontend-checks.result }} ${{ needs.wx-checks.result }} ${{ needs.yousen-checks.result }} ${{ needs.security-scan.result }}"
          case "$results" in
            *failure*|*cancelled*)
              echo "::error::At least one required Tests job failed or was cancelled: $results"
              exit 1
              ;;
          esac
