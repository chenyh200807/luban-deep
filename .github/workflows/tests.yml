name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "scripts/check_contract_guard.py"
      - "scripts/check_turn_contract_guard.py"
      - "scripts/ci/check_websocket_route_allowlist.py"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "CONTRACT.md"
      - "AGENTS.md"
      - "contracts/**"
      - "web/**"
      - "wx_miniprogram/**"
      - "yousenwebview/**"
      - "deployment/**"
      - "docker-compose.yml"
      - "docs/zh/guide/unified-turn-contract.md"
      - ".github/workflows/tests.yml"
      - ".github/pull_request_template.md"
      - "scripts/ci/check_secure_routers.sh"
      - "scripts/ci/baselines/secure_routers_baseline.txt"
      - "supabase/migrations/**"
      - "scripts/ci/check_rls_on_create_table.sh"
      - "scripts/ci/baselines/rls_migrations_baseline.txt"
      - "scripts/ci/check_live_rls_regression.sh"
      - "scripts/ci/live_rls_audit.sh"
      - "docs/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "scripts/check_contract_guard.py"
      - "scripts/check_turn_contract_guard.py"
      - "scripts/ci/check_websocket_route_allowlist.py"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "CONTRACT.md"
      - "AGENTS.md"
      - "contracts/**"
      - "web/**"
      - "wx_miniprogram/**"
      - "yousenwebview/**"
      - "deployment/**"
      - "docker-compose.yml"
      - "docs/zh/guide/unified-turn-contract.md"
      - ".github/workflows/tests.yml"
      - ".github/pull_request_template.md"
      - "scripts/ci/check_secure_routers.sh"
      - "scripts/ci/baselines/secure_routers_baseline.txt"
      - "supabase/migrations/**"
      - "scripts/ci/check_rls_on_create_table.sh"
      - "scripts/ci/baselines/rls_migrations_baseline.txt"
      - "scripts/ci/check_live_rls_regression.sh"
      - "scripts/ci/live_rls_audit.sh"
      - "docs/**"

jobs:
  contract-guard:
    name: Contract Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install contract guard dependencies
        run: |
          python -m pip install --upgrade pip
          # pydantic is required because scripts/check_contract_guard.py's
          # evaluate_emitted_error_codes() imports deeptutor.contracts, whose
          # __init__.py transitively imports modules that use pydantic models.
          pip install "PyYAML>=6.0" "pydantic>=2"

      - name: NameError gate (ruff F821 undefined name + F811 redefinition)
        # Single-point defense against the whole NameError class (F821) and
        # silent redefinitions (F811) reaching main. Python has no general lint
        # gate in CI — ruff only runs in opt-in local pre-commit — so cold-path
        # NameErrors (missing `import os`/`Path`/`sys`, unresolved annotations)
        # could land undetected. Scoped to F821,F811 ONLY: the repo carries
        # ~300 other intentionally-relaxed lint findings (pyproject [tool.ruff]
        # select=E,F,I but ignores E501/F841/etc.), so a broader gate could not
        # land. Uses the repo's pyproject [tool.ruff] config automatically.
        run: |
          pip install ruff
          ruff check --select F821,F811 deeptutor deeptutor_cli scripts

      - name: Run contract guard
        run: |
          python scripts/check_contract_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

      - name: Schema registry guard (register-before-use closure)
        # Powers on contracts/schema_registry.yaml: every schema-version id in the
        # codebase must be registered (T1 grading typed object / T2 runtime-consumed
        # contract) or match the T3 ephemeral carve-out. --closure regenerates the
        # full id set and fails on any orphan, so no agent can introduce an
        # unregistered schema without updating the single canonical registry.
        # (Bundling into check_contract_guard.py main() is a later consolidation,
        # blocked only by that file's in-flight WIP; this step makes the gate live now.)
        run: |
          python scripts/check_schema_registry.py --closure

      - name: DB registry guard (no unregistered DB connection / write / url)
        # Powers on contracts/db_registry.yaml: a raw psycopg connection, a write
        # to a table, or a *_DB_URL env not declared in the registry fails CI —
        # stops the bleeding on the ad-hoc-connection class that caused the
        # two-Supabase-project surprise (all 15 existing sites are grandfathered).
        # Full-repo scan (scanner self-scopes to psycopg files). Bundling into
        # check_contract_guard.py is a later consolidation blocked by its WIP.
        run: |
          python scripts/check_db_registry.py $(git ls-files 'deeptutor/**/*.py' 'scripts/**/*.py')

      - name: env / flag / credential registry guard (no unregistered env / 假灰度)
        # Powers on contracts/env_registry.yaml: a NEW env referenced via
        # os.getenv/os.environ/env_store.get/env_flag that the registry does not
        # list fails CI (rule a, 防新增裸 env), and a NEW env_flag() read of an
        # unregistered name fails CI (rule b, 防假灰度 — a misspelled gray-release
        # flag silently returns env_flag's default, so KB v5 / LUBAN_V1 rollouts
        # would look live but never take effect). All 284 existing references are
        # grandfathered. Full-repo scan. Bundling into check_contract_guard.py is a
        # later consolidation blocked by its WIP.
        run: |
          python scripts/check_env_registry.py $(git ls-files 'deeptutor/**/*.py' 'scripts/**/*.py')

      - name: provider registry guard (no unregistered provider base_url / 第二权威)
        # Powers on contracts/provider_registry.yaml: a NEW hardcoded provider
        # base_url literal at a call site that does not resolve from the canonical
        # registry fails CI (rule a, 防新增旁路 — a scattered endpoint drifts and
        # mis-attributes cost, the deepseek-billing先例), and a NEW provider added
        # to a deprecated registry copy fails CI (rule b, 防第二权威再生 —三套
        # registry 收成一套). All 12 existing bypass sites + the two deprecated
        # copies are grandfathered. Full-repo scan exits 0 today. Bundling into
        # check_contract_guard.py is a later consolidation blocked by its WIP.
        run: |
          python scripts/check_provider_registry.py $(git ls-files 'deeptutor/**/*.py' 'scripts/**/*.py')

      - name: WebSocket single-control-plane allowlist gate
        # Reflects the live FastAPI app's production WebSocket surface and fails
        # on any WS route not declared in contracts/index.yaml websocket_routes,
        # or any second chat WS (turn.md:22). Reflection needs server deps; the
        # contract-guard step above degrades to a skip-with-note when they are
        # absent, so this step is the load-bearing enforcement.
        run: |
          pip install -r requirements/server.txt
          python scripts/ci/check_websocket_route_allowlist.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Secure router fail-on-new gate
        run: FAIL_ON_NEW=1 bash scripts/ci/check_secure_routers.sh

      - name: RLS fail-on-new gate
        run: FAIL_ON_NEW=1 bash scripts/ci/check_rls_on_create_table.sh

      - name: Rate limit single-authority gate
        run: bash scripts/ci/check_rate_limit_single_authority.sh

      - name: LLM client factory gate
        run: bash scripts/ci/check_llm_client_factory.sh

      - name: Runtime safety wiring gate
        run: bash scripts/ci/check_runtime_safety_usage.sh

      - name: Migration uniqueness gate
        run: bash scripts/ci/check_migration_uniqueness.sh

      - name: Live RLS regression gate
        # Skips with a warning when SUPABASE_DB_URL is not configured (forks /
        # missing secret), so a missing credential never blocks CI. When the
        # secret is present, it fails on any monitored PII table that still
        # grants anon/authenticated (regression guard for the P5 hardening).
        run: bash scripts/ci/check_live_rls_regression.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  import-check:
    name: Import Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: contract-guard
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install minimal dependencies for import check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt

      - name: Check module imports
        run: |
          echo "🐍 Testing with Python ${{ matrix.python-version }}"
          python -c "from deeptutor.runtime.orchestrator import ChatOrchestrator; print('✅ Orchestrator imports OK')"
          python -c "from deeptutor.runtime.registry.tool_registry import get_tool_registry; print('✅ Tool registry imports OK')"
          python -c "from deeptutor.runtime.registry.capability_registry import get_capability_registry; print('✅ Capability registry imports OK')"
          python -c "from deeptutor.services.config.env_store import EnvStore; print('✅ EnvStore imports OK')"
          python -c "from deeptutor.api.routers.unified_ws import unified_websocket; print('✅ Unified WS imports OK')"
          python -c "from deeptutor.services.prompt.manager import PromptManager; print('✅ Prompt manager imports OK')"
          python -c "from deeptutor.logging import get_logger; print('✅ Logging imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  smoke-tests:
    name: Smoke Tests (Python 3.11)
    runs-on: ubuntu-latest
    needs: import-check
    timeout-minutes: 12
    env:
      LANGFUSE_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install pytest pytest-asyncio

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke test subset"
          pytest -q --import-mode=importlib \
            tests/api \
            tests/cli \
            tests/services/test_import_smoke.py \
            tests/services/test_app_facade.py \
            tests/services/test_model_catalog.py \
            tests/services/test_path_service.py \
            tests/runtime/test_orchestrator_autoroute.py \
            tests/capabilities/test_deep_question_question_review.py \
            tests/capabilities/test_deep_question_lightweight_generation.py \
            tests/services/test_render_presentation.py \
            tests/services/memory \
            tests/services/session \
            tests/security \
            tests/tools
        env:
          PYTHONPATH: ${{ github.workspace }}

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: contract-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend checks
        working-directory: web
        run: |
          npm run lint
          ./node_modules/.bin/tsc -p tsconfig.json --noEmit
          npm run build:perf

  wx-checks:
    name: WX Checks
    runs-on: ubuntu-latest
    needs: contract-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check Mini Program JS
        run: |
          find wx_miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Mini Program regression scripts
        run: |
          node wx_miniprogram/tests/test_mcq_detect.js
          node wx_miniprogram/tests/test_markdown.js
          node wx_miniprogram/tests/test_progressive_disclosure_render.js
          node wx_miniprogram/tests/test_answer_leak_attack.js
          node wx_miniprogram/tests/test_ai_message_state.js
          node wx_miniprogram/tests/test_ws_stream_pure_contract.js
          node wx_miniprogram/tests/test_stream_token_boundary.js

  yousen-checks:
    name: Yousen Checks
    runs-on: ubuntu-latest
    needs: contract-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check Yousen Mini Program JS
        run: |
          find yousenwebview -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run full Yousen regression suite
        # yousenwebview is the production yousen (佑森) mini-program front-end;
        # wx_miniprogram tests above are the shadow contract harness only.
        #
        # Runs every yousenwebview/tests/test_*.js file. Stability was
        # measured locally at 3 consecutive clean runs of 62 tests with 0
        # flakes and a 5-6s wallclock; the suite has no network, login
        # state, time dependency, or ordering coupling. Each file is
        # invoked via `node` so future tests get CI coverage automatically
        # — no workflow edit needed. Failures are collected, every test's
        # stdout is grouped in the GitHub Actions log via ::group:: lines
        # for easy triage, and the step exits non-zero with a summary if
        # any file fails.
        run: |
          set -u
          fail_list=""
          total=0
          for t in yousenwebview/tests/test_*.js; do
            name="$(basename "$t" .js)"
            total=$((total + 1))
            echo "::group::yousen $name"
            if node "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              fail_list="${fail_list}${fail_list:+ }${name}"
            fi
          done
          if [ -n "$fail_list" ]; then
            echo "::error::Yousen suite: $(echo "$fail_list" | tr ' ' '\n' | wc -l | tr -d ' ') of $total tests failed"
            echo "Failed tests:"
            for n in $fail_list; do echo "  - $n"; done
            exit 1
          fi
          echo "Yousen suite: $total/$total tests passed"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # BLOCKING: no real dotenv file may ever be tracked. Direct guard against the
      # ".env with live keys committed" failure mode — .env* is gitignored, but an
      # agent using `git add -f` / `git add -A` from a dirty tree could force one in.
      - name: No tracked .env files (BLOCKING)
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.(example|sample|template)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::A dotenv file is tracked by git — it must never be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Install scanners
        run: pip install "bandit[toml]" pip-audit detect-secrets

      # BLOCKING secret scan. The local pre-commit detect-secrets hook is bypassable
      # (and was bypassed — multiple agents push straight to main), so the only reliable
      # guard is server-side CI. detect-secrets-hook exits non-zero only when a tracked
      # file contains a secret NOT already allowlisted in .secrets.baseline — it does not
      # rewrite the baseline, so there is no generated_at churn / false failure. Catches a
      # committed .env or hardcoded key. The baseline's exclude filters skip artifacts/.
      - name: Secret scan (BLOCKING — fails on any new unregistered secret)
        run: |
          if ! detect-secrets-hook --baseline .secrets.baseline $(git ls-files); then
            echo "::error::detect-secrets found a secret not in .secrets.baseline."
            echo "If real: remove it and ROTATE the credential. If false positive: run"
            echo "'detect-secrets scan --baseline .secrets.baseline', 'detect-secrets audit .secrets.baseline', then commit the updated baseline."
            exit 1
          fi

      # BLOCKING bandit gate for NEW high-severity + high-confidence findings only.
      # `.bandit-baseline.json` pins the 16 pre-existing high-sev findings (assessment/grading
      # debt) so this never blocks on existing code, only on newly introduced HIGH issues
      # (e.g. a fresh os.system / SQL-string / unsafe-deser). Triage the baseline over time
      # and shrink it. The full -ll advisory scan below still surfaces the medium long tail.
      - name: Bandit high-severity gate (BLOCKING — new HIGH/HIGH findings only)
        run: bandit -c pyproject.toml -r deeptutor -lll -iii -b .bandit-baseline.json -q

      # Advisory full-tree -ll scan for the medium-severity long tail (B310/B324/B608).
      - name: Bandit static security scan (advisory)
        continue-on-error: true
        run: bandit -c pyproject.toml -r deeptutor -ll || echo "::warning::bandit surfaced pre-existing findings (advisory until triaged)"

      # pip-audit is advisory for now: deps are unpinned (no lockfile/hash, see
      # maturity audit M10), so a transient upstream CVE should not block CI yet.
      # The local pre-commit hook keeps it disabled (pip-api non-ASCII path bug
      # on Windows) — that bug does not affect Linux CI, so we run it here as warn.
      - name: pip-audit dependency scan (advisory)
        continue-on-error: true
        run: pip-audit --progress-spinner off || echo "::warning::pip-audit found advisories (non-blocking until deps are pinned)"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [contract-guard, import-check, smoke-tests, frontend-checks, wx-checks, yousen-checks, security-scan]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Contract guard | ${{ needs.contract-guard.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Import check (3.11/3.12) | ${{ needs.import-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke tests (3.11) | ${{ needs.smoke-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend checks | ${{ needs.frontend-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WX checks | ${{ needs.wx-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Yousen checks | ${{ needs.yousen-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: needs.contract-guard.result == 'failure' || needs.import-check.result == 'failure' || needs.smoke-tests.result == 'failure' || needs.frontend-checks.result == 'failure' || needs.wx-checks.result == 'failure' || needs.yousen-checks.result == 'failure' || needs.security-scan.result == 'failure'
        run: exit 1
