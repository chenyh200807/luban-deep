name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "scripts/check_contract_guard.py"
      - "scripts/check_turn_contract_guard.py"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "CONTRACT.md"
      - "AGENTS.md"
      - "contracts/**"
      - "web/**"
      - "wx_miniprogram/**"
      - "yousenwebview/**"
      - "deployment/**"
      - "docker-compose.yml"
      - "docs/zh/guide/unified-turn-contract.md"
      - ".github/workflows/tests.yml"
      - ".github/pull_request_template.md"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "scripts/check_contract_guard.py"
      - "scripts/check_turn_contract_guard.py"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "CONTRACT.md"
      - "AGENTS.md"
      - "contracts/**"
      - "web/**"
      - "wx_miniprogram/**"
      - "yousenwebview/**"
      - "deployment/**"
      - "docker-compose.yml"
      - "docs/zh/guide/unified-turn-contract.md"
      - ".github/workflows/tests.yml"
      - ".github/pull_request_template.md"

jobs:
  contract-guard:
    name: Contract Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install contract guard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyYAML>=6.0"

      - name: Run contract guard
        run: |
          python scripts/check_contract_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

  import-check:
    name: Import Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: contract-guard
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install minimal dependencies for import check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt

      - name: Check module imports
        run: |
          echo "🐍 Testing with Python ${{ matrix.python-version }}"
          python -c "from deeptutor.runtime.orchestrator import ChatOrchestrator; print('✅ Orchestrator imports OK')"
          python -c "from deeptutor.runtime.registry.tool_registry import get_tool_registry; print('✅ Tool registry imports OK')"
          python -c "from deeptutor.runtime.registry.capability_registry import get_capability_registry; print('✅ Capability registry imports OK')"
          python -c "from deeptutor.services.config.env_store import EnvStore; print('✅ EnvStore imports OK')"
          python -c "from deeptutor.api.routers.unified_ws import unified_websocket; print('✅ Unified WS imports OK')"
          python -c "from deeptutor.services.prompt.manager import PromptManager; print('✅ Prompt manager imports OK')"
          python -c "from deeptutor.logging import get_logger; print('✅ Logging imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  smoke-tests:
    name: Smoke Tests (Python 3.11)
    runs-on: ubuntu-latest
    needs: import-check

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install pytest pytest-asyncio

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke test subset"
          pytest -q --import-mode=importlib \
            tests/api \
            tests/cli \
            tests/services/test_app_facade.py \
            tests/services/test_model_catalog.py \
            tests/services/test_path_service.py \
            tests/services/memory \
            tests/services/session \
            tests/security \
            tests/tools
        env:
          PYTHONPATH: ${{ github.workspace }}

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: contract-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend checks
        working-directory: web
        run: |
          npm run lint
          ./node_modules/.bin/tsc -p tsconfig.json --noEmit
          npm run build:perf

  wx-checks:
    name: WX Checks
    runs-on: ubuntu-latest
    needs: contract-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check Mini Program JS
        run: |
          find wx_miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Mini Program regression scripts
        run: |
          node wx_miniprogram/tests/test_mcq_detect.js
          node wx_miniprogram/tests/test_markdown.js
          node wx_miniprogram/tests/test_progressive_disclosure_render.js
          node wx_miniprogram/tests/test_answer_leak_attack.js
          node wx_miniprogram/tests/test_ws_stream_pure_contract.js
          node wx_miniprogram/tests/test_stream_token_boundary.js

  yousen-checks:
    name: Yousen Checks
    runs-on: ubuntu-latest
    needs: contract-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax check Yousen Mini Program JS
        run: |
          find yousenwebview -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run full Yousen regression suite
        # yousenwebview is the production yousen (佑森) mini-program front-end;
        # wx_miniprogram tests above are the shadow contract harness only.
        #
        # Runs every yousenwebview/tests/test_*.js file. Stability was
        # measured locally at 3 consecutive clean runs of 62 tests with 0
        # flakes and a 5-6s wallclock; the suite has no network, login
        # state, time dependency, or ordering coupling. Each file is
        # invoked via `node` so future tests get CI coverage automatically
        # — no workflow edit needed. Failures are collected, every test's
        # stdout is grouped in the GitHub Actions log via ::group:: lines
        # for easy triage, and the step exits non-zero with a summary if
        # any file fails.
        run: |
          set -u
          fail_list=""
          total=0
          for t in yousenwebview/tests/test_*.js; do
            name="$(basename "$t" .js)"
            total=$((total + 1))
            echo "::group::yousen $name"
            if node "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              fail_list="${fail_list}${fail_list:+ }${name}"
            fi
          done
          if [ -n "$fail_list" ]; then
            echo "::error::Yousen suite: $(echo "$fail_list" | tr ' ' '\n' | wc -l | tr -d ' ') of $total tests failed"
            echo "Failed tests:"
            for n in $fail_list; do echo "  - $n"; done
            exit 1
          fi
          echo "Yousen suite: $total/$total tests passed"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [contract-guard, import-check, smoke-tests, frontend-checks, wx-checks, yousen-checks]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Contract guard | ${{ needs.contract-guard.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Import check (3.11/3.12) | ${{ needs.import-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke tests (3.11) | ${{ needs.smoke-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend checks | ${{ needs.frontend-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WX checks | ${{ needs.wx-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Yousen checks | ${{ needs.yousen-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: needs.contract-guard.result == 'failure' || needs.import-check.result == 'failure' || needs.smoke-tests.result == 'failure' || needs.frontend-checks.result == 'failure' || needs.wx-checks.result == 'failure'
        run: exit 1
