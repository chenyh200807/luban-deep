name: Runtime Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  backup-restore-drill:
    name: Backup / Restore Drill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-runtime-drill-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-runtime-drill-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install pytest

      - name: Run backup / restore regression
        run: |
          pytest -q tests/scripts/test_runtime_backup_restore.py tests/scripts/test_prune_backups.py
        env:
          PYTHONPATH: ${{ github.workspace }}
