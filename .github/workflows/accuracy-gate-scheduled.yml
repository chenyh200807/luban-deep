name: Accuracy Gate Scheduled

# 持续质量飞轮 V2 第二步 — accuracy_gate 的可调度封装(scripts/quality_gate/scheduled_run.py)。
# 只产 WEAK-GO 报告, 绝不自动盖 GO / 绝不自动 ship 生产, 封板永远人在环。
#
# cron 目前刻意注释掉, 只留 workflow_dispatch 手动触发:
#   V2.5 的调度触发条件(①至少一次三方 SHA 对齐的 --runs 3 全量 GO ②metrics 时序有足够样本看趋势)
#   截至本文件写入时都还没满足(见 domains/quality-flywheel/README.md §调度 / plan doc §V2.6)。
#   待 owner 拿到一次真 GO 证据后, 取消下面 schedule 段的注释即可开启每日调度
#   (建议 off-peak, "0 18 * * *" = 北京时间 02:00)。取消注释的同时请确认
#   contracts/process_registry.yaml 里 accuracy-gate-scheduled 条目仍然登记着。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  issues: write

jobs:
  accuracy-gate-scheduled:
    name: Scheduled accuracy_gate (WEAK-GO report only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # SHA 门要 fetch + rev-parse origin/main, 需要完整历史

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt

      - name: Configure SSH to Aliyun-ECS-2 (SHA 门需要读 host .env + container env)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.ALIYUN_SSH_HOST }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::缺少 ALIYUN_SSH_PRIVATE_KEY / ALIYUN_SSH_HOST secrets, SHA 门无法跑, 见 domains/quality-flywheel/README.md §调度"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aliyun_ecs_2
          chmod 600 ~/.ssh/aliyun_ecs_2
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host Aliyun-ECS-2"
            echo "  HostName $SSH_HOST"
            echo "  User root"
            echo "  Port 22"
            echo "  IdentityFile ~/.ssh/aliyun_ecs_2"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Run scheduled accuracy_gate (WEAK-GO report, never auto-GO)
        id: gate
        env:
          DEEPTUTOR_QA_USERNAME: ${{ secrets.WECHAT_QA_USERNAME }}
          DEEPTUTOR_QA_PASSWORD: ${{ secrets.WECHAT_QA_PASSWORD }}
          DEEPTUTOR_QA_BASE_URL: ${{ secrets.DEEPTUTOR_QA_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python scripts/quality_gate/scheduled_run.py --runs 3
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "accuracy_gate scheduled_run exit_code=$code"

      - name: Upload WEAK-GO report artifact
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: accuracy-gate-scheduled-report
          path: artifacts/quality_gate/scheduled/
          if-no-files-found: warn
          retention-days: 30

      - name: Annotate misaligned skip (exit 2, not a failure)
        if: steps.gate.outputs.exit_code == '2'
        run: echo "::warning::skipped:misaligned — 三方 SHA 不齐, 本次调度已跳过(未跑任何探针), 详见 artifact accuracy-gate-scheduled-report"

      - name: Alert on BLOCK (exit 3) — report only, never auto-fix
        if: steps.gate.outputs.exit_code == '3'
        env:
          WEBHOOK_URL: ${{ secrets.QUALITY_GATE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="accuracy_gate 调度跑复现阻断(BLOCK) — 见 artifact accuracy-gate-scheduled-report。人工确认, 不会自动修复。 ${RUN_URL}"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "$(python3 -c 'import json,os,sys; print(json.dumps({"msg_type":"text","content":{"text":os.environ["MSG"]}}))')" \
              "$WEBHOOK_URL" || echo "::warning::webhook 发送失败, 请检查 QUALITY_GATE_WEBHOOK_URL"
          else
            gh issue create \
              --title "accuracy_gate 调度跑复现阻断(BLOCK) — $(date -u +%Y-%m-%d)" \
              --body "$MSG"$'\n\n'"这是自动化门产出的 WEAK-GO 报告发现, 只报告, 不自动修复。人工需核 artifact 里的六维矩阵 + evidence 路径, 定位真实回归。" \
              --label "quality-gate" || echo "::warning::gh issue create 失败(可能缺 issues:write 权限或 label 不存在)"
          fi

      - name: Fail job when gate result needs human attention (exit 3 or 4)
        if: steps.gate.outputs.exit_code == '3' || steps.gate.outputs.exit_code == '4'
        run: |
          echo "::error::accuracy_gate scheduled_run exit_code=${{ steps.gate.outputs.exit_code }} — 需要人工介入, 详见 artifact"
          exit 1
