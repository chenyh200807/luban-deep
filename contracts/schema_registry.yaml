version: 1

# ─────────────────────────────────────────────────────────────────────────────
# Luban grading typed-object Schema Registry — Policy-as-code single authority.
#
# This file is the ONE machine-readable catalog of which grading/scoring typed
# objects may be used, what their canonical field names are, and which authority
# values each field may carry. It turns the AGENTS.md §5.7 documentary hard gate
# ("禁止第三套 schema" / 单一权威) into a real, deterministic CI gate enforced by
# scripts/check_schema_registry.py.
#
# Governing spec:
#   docs/plan/鲁班knowql/UNIFIED_GRADING_OBJECT_SCHEMA.md  (§1 inventory, §2 canonical)
#   docs/plan/鲁班knowql/KNOWQL_BUILDOUT_BLUEPRINT.md      (§2 single-authority spine, §4 D2)
# Code authority (do not duplicate the field list — derive in tests if drift risked):
#   deeptutor/services/construction_grading/unified_grading_object.py
#   deeptutor/services/construction_grading/grading_object_adapters.py
#
# THIS REGISTRY IS NOT A TRANSPORT, NOT A RELEASE/CANONICAL-WRITE AUTHORITY.
# It is a deterministic policy filter. It grants no official-score authority.
# ─────────────────────────────────────────────────────────────────────────────

# ── Scope rule (read before adding — 别官僚) ─────────────────────────────────
#
# Only schemas that are BASE / CROSS-CONSUMER / PERSISTED MUST be registered to
# be usable — i.e. the ones where a single field-name drift would create a
# SECOND AUTHORITY or crash a cross-agent reader. Concretely a schema MUST be
# registered when it is any of:
#   - read by more than one consumer (grader, KnowQL query layer, learner brain), OR
#   - persisted to an artifact / DB / answer-key release that other runs read, OR
#   - a grading/scoring/answer-key typed object whose field names other code
#     binds to by name (max_score / statement / authority_source / span_hash …).
#
# Ephemeral, single-function-internal dicts are NOT required to register — a
# local intermediate dict that never escapes one function is out of scope. The
# guard only inspects code that emits a `schema = "…"` / `schema_id` /
# `schema_version` literal OR constructs a grading object with named fields.
scope_rule:
  must_register_if_any:
    - cross_consumer            # read by grader AND/OR query layer AND/OR learner brain
    - persisted                 # written to artifact / DB / answer-key release others read
    - named_field_binding       # other code binds to its field names (max_score/statement/…)
  not_required:
    - ephemeral_internal_dict   # never escapes one function; no cross-reader contract

# ── Completeness closure (full-set scan, three-tier, no orphan) ──────────────
#
# "Registered-or-you-can't-use" is only honest if EVERY schema identifier in the
# codebase has an explicit verdict. This section makes the catalog CLOSED: every
# typed-object / grading / canonical-contract schema-version literal in
# deeptutor/ scripts/ contracts/ lands in exactly one tier — registered (T1),
# registered-as-runtime-canonical (T2), or covered by an explicit T3 carve-out
# rule (an ephemeral one-shot artifact). No "unlisted so I'll just use it" gap.
#
# Authoritative full set is REGENERATED in code+test (no hand-maintained copy):
#   scripts/check_schema_registry.py::collect_all_schema_identifiers()
#   tests/scripts/test_schema_registry.py::test_full_set_is_closed_three_tier
# The grep the task started from ("SCHEMA = " + '"schema":' + 'schema_version":')
# yields 152, but it MISSES the SCHEMA_ID= / schema_id: / *_SCHEMA= literal forms
# — and 8 of the 9 T1 grading objects live ONLY in those missed forms. So the
# honest full set is the UNION across all literal forms. The "152" was an
# incomplete baseline; the live count below is the closed authority this section
# keys off and is pinned by tests/scripts/test_schema_registry.py.
completeness_closure:
  full_set_count: 215            # union across all schema-version literal forms (+lecture answer pack + PGO supply verdicts + M35 R4 cached AB artifact; +fusion stage0 pack taxonomy registry + question->pack map; +case light-practice scoring-point read-view; +case calc-step DAG+ECF)
  primary_grep_baseline: 152     # task's narrow grep; missed SCHEMA_ID=/schema_id: forms
  tier_counts:
    tier1_typed_grading_object: 9    # the `schemas:` list below (1 canonical + 8 deprecated)
    tier2_runtime_canonical: 35      # tier2_canonical_contracts below (+lecture answer pack/shard + PGO runtime-supply slot; +fusion stage0 two compiled read-only artifacts; +case light-practice scoring-point read-view PINNED; +case calc-step DAG+ECF PINNED)
    tier3_ephemeral_artifact: 171    # covered by tier3_carve_out rule (+PGO runtime-supply verification report; lecture answer shard promoted out to T2; +M35 R4 cached AB artifact)
  # Closure invariant (asserted by the test): T1 ∪ T2 ∪ T3 == full_set, with
  # T1, T2 disjoint and exhaustive over the non-T3 remainder; every full-set id
  # not in T1/T2 MUST match a tier3_carve_out pattern (no uncovered identifier).

# ── Content / asset contracts (non-grading, non-runtime-canonical) ───────────
#
# These contracts govern persisted teaching/preview artifacts that are consumed by
# the diagram-microlesson production toolchain, not by the grading / serving /
# learner-brain runtime. They are registered here to prevent untracked content
# schema drift, but they are deliberately outside T1/T2: no official-score
# authority, no runtime-canonical claim, no grading field canonicalization.
content_asset_contracts:
  - name: luban_teaching_animation.v0
    owner: diagram_microlesson
    contract_for: presentation-only lesson artifact (beats/narration/QA/timing/action metadata)
    validation_gate: artifacts/luban_case_family_assets/diagram_microlesson/validate_animation_action_schema.py
    validation_scope: optional-present animation_action[] by default; per-card gate may pass --require-actions
    consumed_by: build_lesson_narration.mjs + render_teaching_animation.py + render_archetype_journey.py + validate_timing_sync.mjs
    official_score_allowed: false
    runtime_canonical: false
    grading_authority: false
  - name: luban_card_bundle_manifest.v0
    owner: diagram_microlesson
    contract_for: preview/production asset manifest (master/lesson/timing/rendered/practice file list and hashes)
    validation_gate: artifacts/luban_case_family_assets/diagram_microlesson/build_card_bundle_manifest.py
    validation_scope: required core assets plus timing audio by default; practice can be made blocking with --require-practice; emitted paths are bundle-root relative
    consumed_by: gate.sh + preview/review workflow + later WeChat WebView package assembly
    official_score_allowed: false
    runtime_canonical: false
    grading_authority: false
  - name: luban_concept_card_bank.v0
    owner: luban_lesson
    contract_for: >-
      review-module concept-card bank (双轮 §6.2 30秒再认卡) — deterministic
      compile-time projection of a signed pack's §1 knowledge panorama joined to
      compiled_source verbatim quotes (point_id provenance; no-quote rows
      fail-closed). Persisted as
      docs/原始数据/考点原料/成品/_{pack_id}_concept_card_bank.v0.json. Follows the
      variant-bank precedent — dash-namespaced schema_version literal
      ("luban-concept-card-bank", deliberately outside the grading closure) and the
      same candidate→signed human promotion gate
      (promote_variant_bank.py --kind concept_cards).
    validation_gate: scripts/build_luban_concept_card_bank.py --check (rerun derive + quote-verbatim/dedupe/forbidden-word gate, zero-write)
    consumed_by: deeptutor/services/luban_lesson/concept_cards.py (read-only projection behind the signed+sha double fail-closed loader; flag-gated review read model — never grading / learner-brain input)
    official_score_allowed: false
    runtime_canonical: false
    grading_authority: false

# ── Tier3 carve-out: ephemeral one-shot artifacts (rule, NOT 1:1 registration) ─
#
# Tier3 = audit / eval / ab / gate / report / packet / record / work_orders /
# review / smoke / diagnostic / probe / closure / decision / analysis /
# preflight / dry_run / spot_check / trace / seed / validation / shard / etc.
# These are produced once and never re-read by a runtime contract, so registering
# each by name would be bureaucratic. Instead the guard treats any schema id that
# matches a carve-out pattern AND is not in T1/T2 as an allowed ephemeral artifact
# (it never needs a registry entry, and the guard's unregistered-name fail does
# not fire on it). The closure test asserts these patterns cover 100% of the
# non-T1/non-T2 remainder, so the carve-out can't silently leave a gap.
tier3_carve_out:
  rule: >-
    A schema-version literal that is NOT a registered T1 grading typed object and
    NOT a registered T2 runtime-canonical contract is an allowed ephemeral
    artifact iff its name matches one of artifact_name_patterns below. Such
    artifacts are write-once eval/audit/release-pipeline outputs with no
    cross-run runtime contract; they require no per-name registration.
  # Substring patterns (matched case-insensitively against the schema id). Kept as
  # a closed list so the completeness test can prove full coverage of the T3 set.
  artifact_name_patterns:
    - _audit
    - _eval
    - _ab.            # four_arm_*_ab.v1 / *_three_arm_eval / *_ab variants
    - _ab_
    - _gate           # *_strong_go_gate / *_readback_gate / *_coverage_gate
    - _report
    - _packet
    - _packets
    - _record         # operator_signature_record / *_audit_record
    - _work_orders
    - _review
    - _reviewed
    - _decision
    - _decisions
    - _analysis
    - _preflight
    - _dry_run
    - _spot_check
    - _trace          # judge_grading_to_brain_trace
    - _seed
    - _validation
    - _shard          # semantic_review_shard(s) — review batching, not topic_shard runtime
    - _shards
    - _candidate      # *_candidate / *_candidates / *_candidate_batch / *_candidate_patch
    - _candidates
    - _probe
    - _closure
    - _smoke
    - _diagnostic
    - _fixture        # m35_fastapi_*_fixture (test fixtures)
    - _ledger         # compiler_status_ledger
    - _crosscheck
    - _coverage       # taxonomy_coverage_expansion / source_corpus_coverage_gate / p0a_coverage
    - _expansion
    - _readback
    - _repair         # residual_source_repair / source_alignment_repairs handled in T2 by name
    - _refinement
    - _rebuild
    - _rehome
    - _reanchor
    - _relink
    - _recompile
    - _linking
    - _skeleton
    - _inventory
    - _corpus
    - _backfill
    - _streaming      # runtime_token_pack_streaming_ab (A/B over the pack, not the pack)
    - _projection     # context_pack_projection_ab / pcp_nba_candidate_projection
    - _before_after
    - _split_analysis
    - _signature
    - _template
    - _completion
    - _patch
    - _feedback
    - _staging        # registry_candidate_staging
    - _promotion_registry  # canonical_promotion_registry.m33 (local learner-state gate, not runtime)
    - _reconciliation
    - _kb_v5_export   # offline snapshot export, runtime uses live DB
    - _topic_shard    # waterproof topic shard enumeration (manifest lane only, no runtime payload reader)
    - _sample         # distillation_sample / phase1_sample_manifest
    - _distillation
    - _residual
    - _shadow         # *_shadow / *_shadow_review / *_shadow_ab (shadow experiments)
    - _blind          # three_model_blind_ab / qwen_blind_residual
    - _quality        # legacy_compilation_quality_audit / runtime_pack_semantic_quality_audit
    - _compat         # learning_evidence_current_standard_compat_audit
    - _interop        # rich_leaf_interop_audit
    - _runner         # llm_deep_compile_runner (one-shot batch runner manifest)
    - _deployment     # frozen_v11_deployment_eval
    - _regression     # runtime_supply_regression (validation of a candidate, not installed)
    - _typed_policy   # build_luban_typed_policy_artifacts (review artifact)
    - _hard_gate_rules  # compiler_hard_gate_rules (compile-time rule dump)
    - _decision_seed
    - rich_leaf_deep_compile_candidate   # explicit: candidate, candidate_only
    - luban_lecture_compiler             # teaching-card persistence, no runtime contract reader
    - luban_rubric_compiler              # compiler utility, consumed only by case-rubric scripts
    - luban_taxonomy_book_derived_rebuild
    - luban_rich_leaf_v2_taxonomy_leaf_linking
    - luban_rich_leaf_source_evidence_agent
    - grading_artifact.v1                # human_validation_slice one-shot (NOT case_grading_artifact.v1)
    # — explicitly-classified Tier3 ids whose name lacks a generic artifact token —
    # (each confirmed by reading its producer + finding no runtime/cross-consumer reader)
    - _authorization_package    # controlled_default / test_learner_writeback authorization (governance, one-shot)
    - _full_compile             # rich_leaf_frozen_full_compile (build artifact; runtime pins the .v2.3 pack, not this)
    - _compile.v               # rich_leaf_scoring_point_compile.v1 (compile-step artifact). Its
                               # runtime_token_pack_units converge to the single typed-object
                               # authority luban_grading_object.v1 via grading_object_adapters
                               # .map_rich_leaf_unit (KnowQL ① convergence; proven by
                               # test_dual_schema_converges_to_single_canonical_authority).
    - runtime_token_pack.v1     # superseded pack version (runtime pins luban_rich_leaf_runtime_token_pack.v2.3 only)
    - runtime_token_pack.v2     # superseded pack version (NOT .v2.3, which is the T2 runtime-pinned pack)
    - runtime_supply_bundle     # luban_runtime_supply_bundle.v1 = M21 one-shot interim, no runtime reader
    - pgo_runtime_supply_verification  # read-only verification report; runtime reads the T2 bank slot, not this report
