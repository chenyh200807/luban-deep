    - luban-multimodel-jury      # multimodel jury gold run
    - luban-shadow-expansion     # shadow expansion gate run
    - luban-agentic-model-bakeoff # agentic model bakeoff run
    - fastapi_case_subquestions  # luban_m35_fastapi_case_subquestions_20q_100a.v1 (artifact_version= judge-trace/readback label)

# ── Canonical authority vocabulary (single source for the guard) ─────────────
# Mirrors deeptutor/services/construction_grading/unified_grading_object.py.
authority_vocabulary:
  authority_source:             # AUTHORITY_SOURCES (4-value enum, object- and point-level)
    - official_answer
    - textbook_cited
    - owner
    - pending_calibration
  span_backed_authorities:      # authorities that MUST carry a span_hash projection proof
    - official_answer
    - textbook_cited
    - owner
  score_authority:              # per-point score authority (must-not-mint gate)
    - pending_calibration_not_official
    - official_answer
  hit_status:
    - hit
    - partial
    - miss
    - contradiction
    - not_evaluated

# ── Canonical drift map (deprecated field name -> canonical field name) ──────
# When the guard sees a drift name used for a registered grading concept, it
# fails and points at the canonical name. Source: UNIFIED §1.1 drift table.
drift_field_map:
  weight: max_score             # #1 case_artifact per-point split name
  canonical_answer: statement   # #1 case_artifact statement name
  label: statement              # #3 scoring_point_assets statement name
  answer_key: statement         # #4 m31 objective statement name
  atomic_official_slice: statement  # #8 per_question statement name

schemas:
  # ── CANONICAL (the one usable grading typed-object schema) ─────────────────
  - name: luban_grading_object.v1
    version: v1
    status: canonical
    owner: construction_grading
    module: deeptutor/services/construction_grading/unified_grading_object.py
    # The approved field names. Using a drift name (see drift_field_map) for any
    # of these concepts on a grading object is a hard fail.
    canonical_fields:
      object_level:
        - schema_id
        - object_id
        - question_type
        - official_total_score
        - official_total_score_authority
        - authority_source
        - scoring_points
        - official_score_allowed       # structural const False
        - canonical_write_allowed      # structural const False
      point_level:
        - point_id
        - statement
        - authority_source
        - span_hash
        - max_score
        - score_authority
        - hit_status
        - required_terms
        - term_provenance
    # Per-field authority_source domain (which authority values are valid where).
    authority_model:
      authority_source: [official_answer, textbook_cited, owner, pending_calibration]
      official_total_score_authority: [official_answer]
      score_authority: [pending_calibration_not_official, official_answer]
    # Drift field names that must NEVER appear on a v1 object/point.
    forbidden_drift_fields:
      - weight
      - canonical_answer
      - answer_key
      - label
      - atomic_official_slice
    # A grading point with a span-backed authority MUST carry span_hash; the
    # guard flags a span-backed point that drops it.
    span_hash_required_for: [official_answer, textbook_cited, owner]
    required_tests:
      - tests/services/construction_grading/test_unified_grading_object.py
      - tests/scripts/test_schema_registry.py

  # ── DEPRECATED (8 pre-existing shapes — each points at its adapter) ────────
  # All map INTO luban_grading_object.v1 via grading_object_adapters.py. New code
  # must emit the canonical schema (directly or via the adapter), not these.
  - name: case_grading_artifact.v1
    status: deprecated
    owner: construction_grading
    module: scripts/run_luban_student_answer_grading_eval.py
    adapter: deeptutor/services/construction_grading/grading_object_adapters.py::map_case_grading_artifact
    canonical_target: luban_grading_object.v1
    drift_fields: [weight, canonical_answer]   # weight->max_score, canonical_answer->statement

  - name: luban.rich_leaf_artifact.v0
    status: deprecated
    owner: construction_grading
    module: deeptutor/services/construction_grading/rich_leaf_artifacts.py
    adapter: deeptutor/services/construction_grading/grading_object_adapters.py::map_rich_leaf_unit
    canonical_target: luban_grading_object.v1
    drift_fields: []                           # statement already canonical; policy_type->sub_type

  - name: luban_scoring_point_assets.v0.1
    status: deprecated
    owner: source_compiler
    module: deeptutor/services/source_compiler/scoring_point_asset_compiler.py
    adapter: deeptutor/services/construction_grading/grading_object_adapters.py::map_scoring_point_assets
    canonical_target: luban_grading_object.v1
    drift_fields: [label]                      # label->statement

  - name: luban_m31_governed_objective_pointer.v1
    status: deprecated
    owner: construction_grading
    module: deeptutor/services/construction_grading/runtime_supply/v3_objective_records_released_m31
    adapter: deeptutor/services/construction_grading/grading_object_adapters.py::map_objective_answer_key_record
    canonical_target: luban_grading_object.v1
    drift_fields: [answer_key]                 # answer_key->statement

  - name: luban_arbitration_gold_panel.v1
    status: deprecated
    owner: construction_grading
    module: scripts/run_luban_arbitration_gold_panel.py
    adapter: deeptutor/services/construction_grading/grading_object_adapters.py::map_gold_panel_row
    canonical_target: luban_grading_object.v1
    drift_fields: []                           # consensus_verdict->hit_status (state, not a field name)

  - name: m35_ai_governed_gold.v1
    status: deprecated
    owner: construction_grading
    module: deeptutor/services/construction_grading/m35_ai_governed_gold.py
    # Protocol-level quality gate, not a per-point object. Aligned by const-flag
    # semantics (official_score_allowed=False, is_release_truth=False) rather than
    # a point adapter, so it has NO adapter entry — see UNIFIED §3 #6 / §4 R2.
    adapter: const_flag_aligned
    canonical_target: luban_grading_object.v1
    drift_fields: []

  - name: compact_scoring_artifact.v1
    status: deprecated
    owner: construction_grading
    module: scripts/run_luban_student_answer_grading_eval.py
    adapter: deeptutor/services/construction_grading/grading_object_adapters.py::map_compact_scoring_artifact
    canonical_target: luban_grading_object.v1
    drift_fields: []                           # expected_points[]->statement (list->per-point)

  - name: luban_per_question_grading_object.v1
    status: deprecated
    owner: construction_grading
    module: deeptutor/services/construction_grading/per_question_grading_object.py
    adapter: deeptutor/services/construction_grading/grading_object_adapters.py::map_per_question_grading_object
    canonical_target: luban_grading_object.v1
    drift_fields: [atomic_official_slice]      # atomic_official_slice->statement

# ── TIER 2 · runtime-consumed canonical contracts (cross-consumer / persisted) ─
#
# These are NOT grading typed objects (that's T1 above) — they are the OTHER
# canonical contracts that a runtime serving / grading / learner-brain path truly
# READS BACK as input. A single field-name drift here crashes a cross-consumer
# reader or mints a second authority, exactly the must-register bar in scope_rule.
# Each entry was verified by reading the producer AND a runtime/cross-consumer
# reader (cited in `consumed_by`); none is a name-only guess.
#
# Field-level canonicalization is NOT yet pinned for these (that is T1's job for
# the grading object). Where the field contract is not yet frozen we mark
# `needs_field_canonicalization: true` as an honest TODO rather than inventing a
# field list. The guard's drift/authority checks therefore DO NOT fire on T2 (no
# fabricated canonical field set); the guard only (a) recognizes the name as
# registered so it is never flagged "unregistered", and (b) emits an OPTIONAL
# warning if a T2 file is touched while marked needs_field_canonicalization, to
# nudge eventual field-level pinning. T2 grants no official-score / write authority.
tier2_canonical_contracts:
  # — assessment report read-model (persisted schema_version, gates DB read-back) —
  - name: p0a-v1
    status: runtime_canonical
    owner: assessment
    canonical_for: assessment report read-model schema version (persisted; gates session report DB read-back)
    module: deeptutor/services/assessment/session_repository.py
    consumed_by: deeptutor/services/assessment/report_read_model.py (REPORT_SCHEMA_VERSION read-back)
    needs_field_canonicalization: true   # dash-format id (P0#2): collector now sees it via the namespace + dash-suffix

  # — learner-state runtime read-model (P2: registry beyond grading) —
  - name: learning_report_read_model.v2
    status: runtime_canonical
    owner: learner_state
    canonical_for: the learning-report read model — single producer + single schema authority (contracts/learning-report.md)
    module: deeptutor/services/learner_state/learning_report_read_model.py
    consumed_by: deeptutor/api/routers/mobile.py (GET /api/v1/mobile/learning-report) + WeChat mini-program learning-report client (wx_miniprogram + yousenwebview/packageDeeptutor; verified no web/ Next.js consumer)
    needs_field_canonicalization: true   # wire payload keeps integer schema_version (1 default / 2 opt-in)

  # — RAG deterministic retrieval plan (P2: registry beyond grading) —
  - name: rag_retrieval_plan.v1
    status: runtime_canonical
    owner: rag
    canonical_for: the deterministic source-aware retrieval plan — single producer + single schema authority (contracts/rag.md)
    module: deeptutor/services/rag/retrieval_plan.py
    consumed_by: deeptutor/services/rag/service.py + deeptutor/services/rag/pipelines/kbv5.py + deeptutor/services/rag/pipelines/supabase.py (build_retrieval_plan across all retrieval lanes)
    needs_field_canonicalization: true   # wire payload (to_dict) keeps integer schema_version (1)

  # — RAG evidence bundle (P2#8 consolidation: 4 inline assembly sites → one builder) —
  - name: rag_evidence_bundle.v1
    status: runtime_canonical
    owner: rag
    canonical_for: the RAG retrieval evidence bundle — single-authority builder (build_evidence_bundle) for every lane (kbv5 / supabase / llamaindex-fallback / historical-question), replacing 4 drifting inline shapes
    module: deeptutor/services/rag/evidence_bundle.py
    consumed_by: deeptutor/services/rag/maintenance.py (audit validator) + deeptutor/tutorbot/agent/tools/deeptutor_tools.py + deeptutor/tools/builtin/__init__.py (boundary trace summaries) + deeptutor/capabilities/deep_question.py (grading-grounding) + deeptutor/agents/question/coordinator.py (evidence refs)
    needs_field_canonicalization: false   # P2#9-style PINNED: canonical_fields = EvidenceBundle dataclass; lane-specific diagnostics live under `trace`; drift is BLOCKING
    canonical_fields:
      - bundle_id
      - query
      - provider
      - kb_name
      - content_blocks
      - sources
      - exact_question
      - retrieval_plan
      - ranking_trace
      - retrieval_empty
      - query_shape
      - retrieval_status
      - retrieval_degraded
      - warning_count
      - trace

  # — learner-state PersonalizationContextPack (P2: registry beyond grading) —
  - name: personalization_context_pack.v1
