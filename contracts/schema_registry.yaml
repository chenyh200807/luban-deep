    # (surfaced 2026-06-14 by the closure-honesty fix: `_FULLSET_NAMESPACE_RE` now also matches
    #  `luban-` (dash) so these persisted `schema_version: "luban-…"` artifact tags enter the
    #  full set instead of silently escaping. Each is a one-shot script-persistence
    #  result-envelope label with no runtime/cross-consumer reader → T3 ephemeral artifact.)
    - luban-consensus            # consensus-coverage / -gold-shadow / -gold-manifest / -gold-expanded
