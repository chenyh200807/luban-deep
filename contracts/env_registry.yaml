# ─────────────────────────────────────────────────────────────────────────────
# env / flag / credential registry — "registered-or-you-can't-read-it".
#
# This file is the ONE machine-readable catalog of every environment variable,
# feature flag, and credential the codebase reads. It turns the
# RESOURCE_GOVERNANCE_FIX_PLAN root-cause business fact —
#   "每个共享资源在被使用前，必须能被机器确认它登记在唯一 canonical 清单里"
# — into a deterministic CI gate enforced by scripts/check_env_registry.py,
# wired into the SAME contract-guard runner (NOT a new governance system).
#
# Sibling registries it mirrors EXACTLY (same shape, same runner):
#   contracts/schema_registry.yaml + scripts/check_schema_registry.py
#   contracts/db_registry.yaml     + scripts/check_db_registry.py
#
# DISCIPLINE:
#   - Deterministic POLICY FILTER, not a transport, not a secret store.
#     It grants no access and reads no secret value — it only records that a
#     name is registered. Adding an entry changes NO behavior; it makes an
#     existing reference machine-checkable.
#   - Single canonical list. No second env inventory may exist. .env.example is
#     a PROJECTION/subset of this registry for local bring-up (see below), not a
#     competing authority.
#   - Records CURRENT STATE only. The 284 references found in deeptutor/+scripts/
#     today are grandfathered. The gate's job is 止血 (stop new drift), not a
#     one-shot cleanup.
#
# THE DANGER THIS GUARDS (why feature_flags are called out separately):
#   A misspelled feature flag makes runtime_env.env_flag(name) silently return
#   its `default` → 灰度看似生效实则没生效 (假灰度). KB v5 (KBV5_RAG_ENABLED) and
#   LUBAN_V1 (LUBAN_V1_*_ENABLED) gray-release correctness depend on these names
#   being exact. A typo is the same failure shape as the learner-memory "假绿".
#
# Governing spec:
#   docs/plan/鲁班knowql/RESOURCE_GOVERNANCE_FIX_PLAN.md      (Layer 2 · P1, §5+§3)
#   docs/plan/鲁班knowql/ENV_FLAG_INVENTORY.md               (the read-only盘点)
# ─────────────────────────────────────────────────────────────────────────────

# ── Scope rule (read before adding — 别官僚) ─────────────────────────────────
# An env name MUST register when production code reads it via any of the read
# entry points below. Tests/fixtures are out of scope.
scope_rule:
  read_entry_points:
    - os.getenv("NAME")
    - os.environ["NAME"] / os.environ.get("NAME")
    - env_store.get("NAME") / get_env_store().get("NAME")
    - runtime_env.env_flag("NAME")   # ← the machine signal "this is a boolean flag"
  must_register_if_any:
    - production_env_reference        # any UPPER_SNAKE literal read in deeptutor/ or scripts/
    - feature_flag_read               # any name read through env_flag()  → must be a registered feature_flag
  not_required:
    - test_or_fixture_reference       # under tests/ ; no production contract
    - dynamic_or_lowercase_key        # os.getenv(var) / os.getenv("lower") — not a governed literal

# ── .env.example relationship (诚实说明，不造第二份竞争清单) ──────────────────
# .env.example is a PROJECTION (subset) of this registry: the ~52 keys a fresh
# local checkout must fill to boot. This registry is the canonical superset of
# EVERY referenced name (284). They are intentionally NOT line-for-line equal;
# .env.example deliberately omits prod-only / cohort / ops keys. Do not promote
# .env.example into a second authority.
env_example_relationship:
  canonical: contracts/env_registry.yaml
  projection: .env.example
  rule: "registered_envs ⊇ keys(.env.example)"

# ── Feature flags (the boolean gray-release surface — most dangerous, typo = 假灰度)
# Every BOOLEAN gray-release / kill-switch flag is listed here with its default
# and gray-release semantics. There are TWO read mechanisms in this codebase:
#   1. runtime_env.env_flag("NAME")  — the canonical reader (33 names).
#   2. os.environ.get("NAME","").strip().lower() in (truthy…)  — hand-rolled
#      boolean parse used by the LUBAN_V1 / Luban kill-switches (12 names).
# The scanner's ENFORCEMENT (rule b) keys ONLY on mechanism 1 (env_flag) — that
# is the deterministic machine signal "this is a flag", so a NEW env_flag() typo
# fails. Mechanism-2 flags are read like any env, so the scanner protects them via
# rule (a) (the name must be a registered env). We still LIST mechanism-2 flags
# here because they ARE the most gray-release-critical names (LUBAN_V1_* / KB) and
# an honest inventory must show the full boolean surface, not just the env_flag
# subset. (A future hardening could route mechanism-2 reads through env_flag to
# bring them under rule b too — out of this minimal收权 scope.)
#   default = value returned when the var is unset — a typo silently yields THIS.
#   read    = env_flag | hand_rolled    (which mechanism reads it)
#   kind ∈ {killswitch, rollout, shadow, dev, config, fallback}
feature_flags:
  - {name: ASSESSMENT_PREWARM_FORMS, default: false, kind: rollout}
  - {name: ASSESSMENT_USE_SUPABASE, default: false, kind: rollout}
  - {name: DEEPTUTOR_CONTEXT_ORCHESTRATION_ENABLED, default: true, kind: killswitch}
  - {name: DEEPTUTOR_ENABLE_API_DOCS, default: false, kind: config}
  - {name: DEEPTUTOR_ENABLE_LEARNING_BRAIN_QA, default: false, kind: dev}
  - {name: DEEPTUTOR_HOME_NEXT_STEP_ENABLED, default: false, kind: rollout}  # home 生命周期融合面总开关:next_step 仲裁 + mastery 证据 blend(首页/雷达/章节盘)一起开关
  - {name: DEEPTUTOR_EXTERNAL_AUTH_ALLOW_LEGACY_DEFAULT, default: false, kind: killswitch}  # security
