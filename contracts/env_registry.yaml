  - {name: KBV5_RAG_ENABLED, default: false, kind: rollout}        # KB v5 gray-release核心
  - {name: LANGFUSE_CAPTURE_INPUT, default: false, kind: config}
  - {name: LANGFUSE_CAPTURE_OUTPUT, default: false, kind: config}
  - {name: LANGFUSE_DEBUG, default: false, kind: config}
  - {name: LANGFUSE_ENABLED, default: false, kind: killswitch}
  - {name: LANGFUSE_HTTPX_TRUST_ENV, default: false, kind: config}
  - {name: LANGFUSE_MASK_PII, default: false, kind: config}        # PII
  # ③稳定性 B2/B4 followup 判定器提速灰度门(2026-07-12): 开 = B2 瘦身 prompt(题干/选项/
  # 作答/history 裁剪,判定必需信号保留) + B4 快档模型(读 W4 唯一档位 accessor
