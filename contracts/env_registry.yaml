  - {name: DEEPTUTOR_MCQ_FEEDBACK_COMPACT, default: false, kind: rollout, read: env_flag}
  - {name: DEEPTUTOR_MEMBER_CONSOLE_ENABLE_DEMO_SEED, default: false, kind: dev}
  - {name: DEEPTUTOR_WECHAT_PHONE_AUTH_REQUIRED_AFTER_TS, default: "1782097380", kind: config}
  - {name: DEEPTUTOR_ROUTING_LLM_TIMEOUT_S, default: "6", kind: config}  # Battle1 W3-T2: 路由LLM硬超时(秒), fail-open降scene=None
  - {name: DEEPTUTOR_SEMANTIC_ROUTER_ENABLED, default: true, kind: killswitch}
  - {name: DEEPTUTOR_SEMANTIC_ROUTER_SHADOW_MODE, default: false, kind: shadow}
  - {name: DISABLE_SSL_VERIFY, default: false, kind: killswitch}  # security: on = disable TLS verify
