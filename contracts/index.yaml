version: 1
entrypoint: CONTRACT.md

# WebSocket single-control-plane allowlist (contracts/turn.md:22).
#
# Machine-readable registry of every production WebSocket route (i.e. routes
# still registered when legacy routers are disabled: _legacy_routers_enabled()
# == False). scripts/ci/check_websocket_route_allowlist.py reflects the live
# FastAPI app and fails CI when:
#   - a registered production WS path is not listed here, OR
#   - any entry has kind "chat" with a path other than /api/v1/ws, OR
#   - more than one entry has kind "chat".
#
# This gives the turn.md:22 hard constraint ("禁止新增第二条聊天 WebSocket")
# real enforcement. It is reflection-based, so alias imports / wrappers /
# include_router chains cannot bypass it (the same rationale as
# scripts/ci/runtime_route_inventory.py). The previously-buried prose under
# learning_state_inference.forbidden was never consumed by any guard.
#
# kind:
#   chat   — a turn/chat streaming entrypoint. Exactly one allowed; path MUST
#            be /api/v1/ws (the single streaming control plane).
#   stream — a non-chat server→client stream (e.g. progress fan-out). Allowed,
#            but must be explicitly registered here with a reason.
websocket_routes:
  - path: /api/v1/ws
    kind: chat
    reason: Single unified turn/chat streaming control plane (contracts/turn.md).
  - path: /api/v1/knowledge/{kb_name}/progress/ws
    kind: stream
    reason: Knowledge-base ingestion progress fan-out. Non-chat; broadcasts build
      progress events only, creates no turn/session state.

# REST route EXISTENCE allowlist (RESOURCE_GOVERNANCE_FIX_PLAN Layer 3 · P2,
# INFRA_REGISTRATION_COVERAGE_AUDIT §6).
#
# WS already has an existence gate (websocket_routes above). REST only had AUTH
# gates (secure_router) + a report-only runtime_route_inventory — no "a new REST
# router must be registered" existence闸. This list closes that gap, mirroring
# the WS allowlist EXACTLY: scripts/ci/check_rest_route_allowlist.py reflects the
# live FastAPI app's PRODUCTION HTTP surface (legacy routers disabled) and fails
# CI when a reflected ROUTER MOUNT PREFIX is not listed here.
#
# It does NOT overlap the WS guard: the WS guard governs APIWebSocketRoute; this
# governs APIRoute (HTTP). The grain is the MOUNT PREFIX (leading static path
# segments — where include_router(prefix=...) mounts), NOT every leaf path: the
# report-only inventory already enumerates leaves for auth. This gate answers the
# governance question the inventory does not — "should this router EXIST?".
#
# DISCIPLINE: records CURRENT STATE only. Every mount registered today is
# grandfathered (止血: a NEW include_router at an unlisted prefix fails CI, not a
# one-shot cleanup). Adding/removing a mount here changes NO behavior — it only
# makes the existing reflected mount machine-checkable. An entry may be listed
# but not currently reflected (behind-flag router); that does not fail the gate.
