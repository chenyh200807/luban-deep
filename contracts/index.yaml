mobile_http_read_models:
  billing_usage:
    path: /api/v1/billing/usage
    authority: wallet_snapshot + wallet_ledger_or_member_usage_meter
    semantics:
      - Wallet snapshot read failure returns status=degraded and no quota rows.
      - When billing enforcement is enabled, wallet ledger is the canonical commerce
        usage authority; ledger read failure must not make the whole usage read model
        unavailable, and the adapter returns status=ok with empty usage entries and
        the snapshot plan.
      - When billing enforcement is disabled for internal beta, MemberUsageMeter may
        provide the non-financial usage display source with charging_status=metered_not_charged;
        it must not mutate wallet balance or wallet ledger. The temporary default display
        budget is 450 turns for every member, configurable by DEEPTUTOR_INTERNAL_BETA_USAGE_LIMIT_TURNS;
        public display labels remain percentage-based rather than exposing remaining turn counts.
      - Usage windows are display read models only; they are not capability routing,
        request config, learner-state, or turn authority.

mobile_http_auth_controls:
  password_reset:
    path: /api/v1/auth/reset-password
    authority: MemberConsoleService -> external_auth
    semantics:
      - Account recovery is a public, rate-limited HTTP auth adapter, not a
        turn/session/capability entrypoint.
      - Request must prove username, registered phone, and SMS code before changing
        the external auth password.
      - Successful reset invalidates existing external auth sessions, consumes the
        SMS code, returns no token, and never auto-logs in.
      - Reset must not write learner summaries, learner memory events, profile,
        progress, goals, wallet, capability route state, or turn/session state.
  wechat_phone_login:
    path: /api/v1/wechat/mp/login
    authority: MemberConsoleService.login_with_wechat_phone
    semantics:
      - Quick login is a public, rate-limited HTTP auth adapter that requires both
        wx.login code and getPhoneNumber phone_code.
      - The route must fail closed when phone_code is absent; wx.login code alone
        must not issue a full learner token.
      - The returned token is minted only after WeChat phone authorization has
        been exchanged and bound to the canonical member identity.
      - The mini-program primary quick-login button must use getPhoneNumber and
        keep audit-safe copy that does not expose WeChat wording in the UI.

