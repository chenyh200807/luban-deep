<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F16 半写案例 · 干净一版</title>
<style>
  :root{--paper:#f4efe6;--card:#fffdf8;--ink:#2a2320;--sub:#7a6f63;--line:#e4dac9;
    --red:#8a2b20;--red-bg:#f7e9e4;--green:#4a6b3d;--green-bg:#eaf0e3;--gold:#c8962f;}
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{margin:0;background:#ded4c2;color:var(--ink);font-family:-apple-system,"PingFang SC","Kaiti SC","Microsoft YaHei",serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:22px 12px 60px}
  .intro{max-width:560px;text-align:center;margin-bottom:14px}
  .intro h1{font-size:17px;margin:0 0 6px;color:#3a2f28}
  .intro p{font-size:13px;color:#6a5f52;line-height:1.7;margin:3px 0}
  .phone{width:372px;background:#fffdf8;border-radius:34px;padding:11px;box-shadow:0 16px 46px rgba(60,40,25,.22);border:1px solid #e7ddcb}
  .screen{background:var(--paper);border-radius:26px;overflow:hidden;min-height:720px;display:flex;flex-direction:column;
    background-image:radial-gradient(rgba(180,160,130,.10) 1px,transparent 1px);background-size:15px 15px}
  .statusbar{display:flex;justify-content:space-between;padding:12px 20px 4px;font-size:11.5px;color:#a89a84}
  .topbar{padding:9px 18px 13px;border-bottom:1px solid var(--line);background:rgba(255,253,248,.7)}
  .topbar .t{font-size:16px;font-weight:700}.topbar .sub{font-size:12px;color:var(--sub);margin-top:2px}
  .body{padding:17px 17px 24px;overflow:auto;flex:1}
  .qmeta{font-size:12px;color:var(--sub);margin-bottom:7px}
  .stem{font-size:15px;line-height:1.7;font-weight:600;color:#332a23;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
  .label{font-size:12px;color:var(--sub);margin:16px 0 6px}
  .answer{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;font-size:14.5px;line-height:1.85;color:#3a2f24}
  .coach{display:flex;gap:11px;background:#fbf4ec;border:1px solid #ecd9c4;border-radius:15px;padding:15px;margin:18px 0 0;font-size:14.5px;line-height:1.85;color:#5a4a3a}
  .coach .av{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fbeee6;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px}
  .coach b{color:var(--red)}
  .ta{width:100%;min-height:64px;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:14.5px;font-family:inherit;background:var(--card);color:#3a2f24;resize:none;margin-top:14px;line-height:1.7}
  .go{display:block;width:100%;text-align:center;background:var(--red);color:#fbeee6;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:12px;cursor:pointer;letter-spacing:1px}
  .see{display:block;text-align:center;margin-top:14px;font-size:13.5px;color:var(--sub);text-decoration:underline;cursor:pointer}
  .reveal{background:var(--green-bg);border:1px solid #cad8ba;border-radius:15px;padding:16px;margin-top:16px;font-size:14.5px;line-height:1.85;color:#3a4a30}
  .reveal h4{margin:0 0 9px;color:var(--green);font-size:16px}
  .reveal .why{background:var(--card);border-radius:12px;padding:13px 14px;margin-top:10px;color:#4a4038;font-size:14px}
  .reveal .src{font-size:12.5px;color:#5d6b4a;margin-top:10px}
  .scoreline{display:flex;justify-content:space-between;align-items:baseline;background:#2a2320;color:#f4efe6;border-radius:14px;padding:14px 17px;margin-top:14px}
  .scoreline .s{font-size:23px;font-weight:800}.scoreline .s .mx{font-size:14px;opacity:.7}
  .note{font-size:12px;color:#9a8f80;margin-top:12px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="intro">
  <h1>F16 起鼓割补 · 半写案例(干净一版)</h1>
  <p>学员先自己写几句 → AI 说"差 1 步"、问一句点他一下 → 他答完或点"看答案" → 揭晓。<br>就一条路。判分数字是真判分内核实跑的。</p>
</div>
<div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span>鲁班智考</span><span>📶 🔋</span></div>
  <div class="topbar"><div class="t">屋面卷材起鼓割补</div><div class="sub">半写作答 · 承接你刚看的微课</div></div>
  <div class="body" id="body"></div>
</div></div>
<script>
var b=document.getElementById('body');
function ask(){
  b.innerHTML=
    '<div class="qmeta">案例 · 半写(写关键工序即可，不用长篇)</div>'+
    '<div class="stem">某屋面卷材防水层局部起鼓。请写出起鼓卷材割补的施工工序。</div>'+
    '<div class="label">你写的</div>'+
    '<div class="answer">先用刀把鼓泡卷材割开，放出气体，擦干水分，清除旧胶结料；然后喷灯烘烤，重贴新卷材，周边压实刮平。</div>'+
    '<div class="coach"><div class="av">✎</div><div>工序主干写对了 👍 —— 放气、清旧胶、烘烤、重贴、压实都在。<b>就差 1 步</b>，它决定新卷材能不能真正粘牢：<b>烘烤之后、贴新卷材之前，鼓包那块翘起的旧卷材，你打算怎么处理它？</b></div></div>'+
    '<textarea class="ta" placeholder="一句话说说你的想法…"></textarea>'+
    '<button class="go" onclick="reveal()">说说我的想法</button>'+
    '<span class="see" onclick="reveal()">想直接看答案？›</span>';
}
function reveal(){
  b.innerHTML=
    '<div class="qmeta">屋面卷材起鼓割补</div>'+
    '<div class="label">你写的</div>'+
    '<div class="answer">先用刀把鼓泡卷材割开，放出气体，擦干水分，清除旧胶结料；然后喷灯烘烤，重贴新卷材，周边压实刮平。</div>'+
    '<div class="reveal"><h4>就差这一步：分层剥开 ✅</h4>'+
    '<div>你的工序主干全对（7 步踩到 6 步），只差把翘起的旧卷材<b>「分层剥开」</b>再贴。</div>'+
    '<div class="why"><b>为什么它是采分点：</b>鼓包下面是层间空鼓 + 残留旧胶。不把旧卷材<b>一层层剥开</b>清理干净就直接盖新的，层间还会再起鼓——评分和现场都卡这一步。补上这一句，这 0.3 分稳稳到手。</div>'+
    '<div class="src">📖 教材原文：屋面防水 · 起鼓割补工序（1A434000 P.XX）</div></div>'+
    '<div class="scoreline"><span>本题采分点得分</span><span class="s">1.2<span class="mx"> / 1.5</span></span></div>'+
    '<div class="note">对错是判分内核判的（真值在后台），AI 只负责怎么讲。training_org 估分 · 非官方 · 待金标校准。</div>';
}
ask();
</script>
</body>
</html>
