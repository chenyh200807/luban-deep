  <title>C02 进度款闯关</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eaf2f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.page{max-width:520px;margin:0 auto;min-height:100dvh;padding:18px 14px 28px}.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.back{flex:0 0 auto;border:1px solid #c6d8e8;border-radius:999px;background:#fff;color:#176b7a;text-decoration:none;font-weight:900;padding:10px 14px}.kicker{margin:0;color:#176b7a;font-size:13px;font-weight:900}.title{margin:2px 0 0;font-size:25px;line-height:1.18}.progress{height:7px;border-radius:999px;background:#d4e2ee;overflow:hidden;margin:18px 0}.progress span{display:block;width:33%;height:100%;background:#ff7a1a}.card{background:#fff;border:1px solid #c6d8e8;border-radius:24px;padding:16px;box-shadow:0 18px 44px rgba(18,43,66,.12)}.stem{font-size:20px;line-height:1.38;font-weight:950;margin:10px 0 14px}.diagram{border:1px solid #eadfcb;border-radius:18px;background:#fffdf7;padding:14px;margin-bottom:14px}.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:center}.node{min-height:54px;border:2px solid #cbdbea;border-radius:999px;display:grid;place-items:center;text-align:center;font-size:14px;font-weight:950;background:#f8fbfd}.node.hot{border-color:#ff7a1a;color:#b45309}.answer{display:block;border:1px solid #d5e0ea;border-radius:18px;padding:14px 13px;margin:10px 0;background:#fff;color:#1b2a3d;font-size:17px;font-weight:900;line-height:1.5}.answer strong{color:#176b7a}.hint{margin-top:14px;border-left:5px solid #176b7a;background:#eef8fb;border-radius:14px;padding:12px 13px;color:#244052;font-weight:850;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.btn{border:1px solid #c6d8e8;border-radius:18px;background:#fff;color:#172033;text-align:center;text-decoration:none;font-weight:950;padding:14px}.btn.primary{background:#176b7a;color:#fff;border-color:#176b7a}@media(max-width:390px){.stem{font-size:18px}.answer{font-size:15px}.chain{grid-template-columns:repeat(2,1fr)}}

<body>
  <main class="page">
    <div class="top">
      <a class="back" href="C02_progress_payment.animation_ir_preview.html">返回讲解</a>
      <div><p class="kicker">鲁班深母题 · 独立闯关</p><h1 class="title">进度款题先判四口径</h1></div>
    </div>
    <div class="progress"><span></span></div>
    <section class="card">
      <div class="diagram" aria-label="四口径资金链">
        <div class="chain">
          <div class="node">哪笔钱</div>
          <div class="node">量价口径</div>
          <div class="node hot">时点口径</div>
          <div class="node">扣减口径</div>
        </div>
      </div>
      <p class="stem">题干给出累计完成额已超过起扣点。本月计算进度款时,最容易漏掉哪一步?</p>
      <div class="answer"><strong>A.</strong> 只用本月完成额乘支付比例,不看累计应得。</div>
      <div class="answer"><strong>B.</strong> 先算累计应得,再扣累计预付款扣回、前期已付和发包人扣款。</div>
      <div class="answer"><strong>C.</strong> 把综合单价先加税,再乘工程量。</div>
      <div class="hint">采分判断:本题核心是“累计达到起扣点后扣回”。完整答案要写出累计口径和扣回口径,不是只报一个公式。</div>
      <div class="actions">
        <a class="btn" href="C02_progress_payment.animation_ir_preview.html">从头看</a>
        <a class="btn primary" href="#">先作答</a>
      </div>
    </section>
  </main>
</body>
