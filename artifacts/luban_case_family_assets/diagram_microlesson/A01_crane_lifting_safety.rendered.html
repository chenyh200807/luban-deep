const chapterLabels=["先学","错觉","人证","装置","试吊","应急","采分","闯关"];
const scene=document.getElementById("scene"),lesson=document.getElementById("lesson"),audio=document.getElementById("audio"),centerPlay=document.getElementById("centerPlay"),playBtn=document.getElementById("playBtn"),pauseBtn=document.getElementById("pauseBtn"),muteBtn=document.getElementById("muteBtn"),restartBtn=document.getElementById("restartBtn"),scrub=document.getElementById("scrub"),fill=document.getElementById("fill"),capTitle=document.getElementById("capTitle"),capText=document.getElementById("capText"),timeLabel=document.getElementById("timeLabel"),cta=document.getElementById("cta"),gate=document.getElementById("gate"),fullBtn=document.getElementById("fullBtn"),exitFullBtn=document.getElementById("exitFullBtn"),quickOptions=document.getElementById("quickOptions"),atoms=[...document.querySelectorAll("#atoms div")],dots=[...document.querySelectorAll(".beat-dot")];
let unlocked=false,dragging=false,hideTimer=null;
function pad(n){return String(Math.floor(n)).padStart(2,"0")}function fmt(x){return `${pad(x/60)}:${pad(x%60)}`}
function segmentAt(t){let s=segments[0];for(const seg of segments){if(t>=seg.startSec-.05)s=seg}return s}
function chapterAt(t){let k=0;chapterTimes.forEach((c,i)=>{if(t>=c-.05)k=i});return k}
function stateFor(seg){
  if(seg.kind==="closing")return "closing";
  if(seg.kind==="q")return "qa";
  if(seg.kind==="a"&&seg.anchor&&seg.anchor.includes("trial_lift"))return "trial";
  if(seg.kind==="a"&&seg.anchor&&seg.anchor.includes("environment"))return "device";
  if(seg.kind==="a"&&seg.anchor&&seg.anchor.includes("emergency"))return "stop";
  return seg.state;
}
function renderGate(focus){
  const gates=[["personnel","人证","司机、信号、司索持证到位"],["device","装置","安全装置可靠,天气复工条件满足"],["trial","试吊","90%以上先离地约15cm试吊检查"],["stop","应急","异常停吊,归零断电,重物落地"]];
  return `<div class="decision">${gates.map(([id,b,t])=>`<div class="gate ${id===focus?"hit":""} ${id!==focus?"dim":""}"><b>${b}</b><span>${t}</span></div>`).join("")}</div>`;
}
function craneSvg(){
  return `<div class="crane-focus"><svg viewBox="0 0 360 250"><path class="dark" d="M42 44h210M82 44v176M222 44v176" stroke-width="10" stroke-linecap="round" fill="none"/><path class="dark" d="M222 44c56 40 56 96 16 142" stroke-width="9" stroke-linecap="round" fill="none"/><path class="dark" d="M238 186v28M220 214h36" stroke-width="8" stroke-linecap="round" fill="none"/><rect x="198" y="176" width="78" height="44" rx="12" fill="#fff3e9" stroke="#f97316" stroke-width="5"/><text x="237" y="204" text-anchor="middle" class="trial-label">95%</text><path d="M286 198h56" class="orange" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 9"/><text x="286" y="184" fill="#f97316" font-size="16" font-weight="900">15cm试吊</text></svg></div>`;
}
function sceneHtml(seg){
  const st=stateFor(seg);
  if(st==="hook")return `<div class="eyebrow">先别急着吊</div><h2>考场问的是<br>能不能正式吊</h2><p>不是背安全管理,而是把“先试吊、再检查、确认后继续”写成分。</p>${craneSvg()}`;
  if(st==="trap")return `<div class="eyebrow">先抓错觉</div><div class="trap-card"><b>人员+设备<br>不等于能吊</b><span>漏掉试吊检查,结论就错。</span></div>`;
  if(st==="personnel")return `<div class="eyebrow">第一门</div><h2>人证</h2><p>关键人员不到位,不能进入试吊。</p>${renderGate("personnel")}`;
  if(st==="device")return `<div class="eyebrow">第二门</div><h2>装置环境</h2><p>安全装置可靠;雨雪后还要清理、防滑、防漏电。</p>${renderGate("device")}`;
  if(st==="trial")return `<div class="eyebrow">第三门</div><h2>试吊检查</h2><p>90%以上负荷,先离地约15cm试吊。</p>${craneSvg()}<div class="single-gate"><b>试吊</b><span>查平稳性、设备和绑扎,确认安全后再继续。</span></div>`;
  if(st==="stop")return `<div class="eyebrow">第四门</div><h2>停吊应急</h2><p>归零、断电、重物落地,不能悬空等待。</p>${renderGate("stop")}`;
  if(st==="score")return `<div class="eyebrow">答题纸</div><div class="score-paper"><h3>采分句四格</h3><div><mark>90%以上</mark>额定起重量</div><div>离地约<mark>15cm试吊</mark></div><div>检查平稳性、设备、绑扎</div><div>确认安全后方可继续</div></div>`;
  if(st==="bridge")return `<div class="eyebrow">记忆钩子</div><h2>四道门</h2><p>人证、装置环境、试吊、停吊应急。换题也按这条线判。</p>${renderGate("trial")}`;
  if(st==="qa")return `<div class="eyebrow">学生追问</div><div class="qa-box"><b>晨煦问</b><p>${seg.text}</p></div>`;
  return `<div class="eyebrow">收个尾</div><h2>别只写设备没问题</h2><p>先过四道门,尤其把高负荷试吊检查写完整。现在开始闯关。</p>${renderGate("trial")}`;
}
function unlock(){if(unlocked)return;unlocked=true;cta.textContent=cta.dataset.readyLabel;cta.classList.add("ready");cta.removeAttribute("aria-disabled");gate.textContent="② 开始闯关";gate.classList.add("ready");gate.removeAttribute("aria-disabled")}
function paint(){
  const t=audio.currentTime||0,pct=Math.min(1,t/total);if(!dragging)scrub.value=String(Math.round(pct*1000));fill.style.width=`${pct*100}%`;timeLabel.textContent=`${fmt(t)} / ${fmt(total)}`;
  const seg=segmentAt(t),st=stateFor(seg),ci=chapterAt(t),chapter=chapterLabels[ci],preStart=t<.05&&audio.paused&&!lesson.classList.contains("started");
  scene.className=`scene scene-${st}`;scene.innerHTML=sceneHtml(seg);
  if(!preStart){capTitle.textContent=`${ci+1}. ${chapter}`;capText.textContent=seg.text;}
  lesson.classList.toggle("started",t>0||!audio.paused);lesson.classList.toggle("state-hook",stateFor(seg)==="hook");
  dots.forEach((d,i)=>{d.classList.toggle("active",i<=ci);d.classList.toggle("current",i===ci)});
  atoms.forEach((a,i)=>{const on=ci>=[2,3,4,5][i];a.classList.toggle("on",on);if(on)a.querySelector("span").textContent=["持证到位","装置环境合格","15cm试吊检查","异常停吊落地"][i]});
  if(t>=total-.25||audio.ended)unlock();
}
quickOptions.addEventListener("click",e=>{const btn=e.target.closest("button");if(!btn)return;const c=btn.dataset.choice;quickOptions.querySelectorAll("button").forEach(b=>b.disabled=false);btn.disabled=true;if(c==="correct"){capTitle.textContent="判对了:第三门是刀口";capText.textContent="不能直接正式吊。95%已超过90%控制线,要先离地约15cm试吊,检查平稳性、设备和绑扎。"}else if(c==="wrong"){capTitle.textContent="这就是本题错觉";capText.textContent="设备够不等于能正式吊。高负荷起吊前漏掉试吊检查,主观题最后一句就丢分。"}else{capTitle.textContent="看完只抓一个动作";capText.textContent="接下来只看四道门,尤其是90%以上先15cm试吊这一步。"};try{navigator.vibrate&&navigator.vibrate(8)}catch(err){}});
async function play(){lesson.classList.add("started");try{await audio.play()}catch(err){}paint();showControls(true)}
function pause(){audio.pause();paint();showControls(false)}
centerPlay.onclick=play;playBtn.onclick=play;pauseBtn.onclick=pause;restartBtn.onclick=()=>{audio.currentTime=0;play()};muteBtn.onclick=()=>{audio.muted=!audio.muted;muteBtn.textContent=audio.muted?"取消静音":"静音"};
audio.addEventListener("timeupdate",paint);audio.addEventListener("loadedmetadata",paint);audio.addEventListener("ended",()=>{unlock();paint()});
scrub.oninput=()=>{dragging=true;audio.currentTime=Number(scrub.value)/1000*total;paint()};scrub.onchange=()=>{dragging=false;paint()};
dots.forEach(d=>d.onclick=()=>{audio.currentTime=chapterTimes[Number(d.dataset.i)];paint();showControls(true)});
function guard(e){if(!unlocked){e.preventDefault();capText.textContent="先听完收尾,再进入闯关。";showControls(false)}}cta.onclick=guard;gate.onclick=guard;
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null}function setFullButton(){fullBtn.textContent=fsEl()||lesson.classList.contains("theater")?"退出":"全屏"}
function hideControls(){clearTimeout(hideTimer);hideTimer=null;lesson.classList.remove("controls-visible")}function showControls(auto=true){if(!lesson.classList.contains("theater"))return;clearTimeout(hideTimer);lesson.classList.add("controls-visible");if(auto&&!audio.paused)hideTimer=setTimeout(()=>lesson.classList.remove("controls-visible"),3200)}
async function toggleFull(e){e&&e.stopPropagation();const active=fsEl()||lesson.classList.contains("theater");if(active){if(fsEl()){try{await (document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(err){}}lesson.classList.remove("native-fullscreen","theater");hideControls();setFullButton();return}lesson.classList.add("theater");showControls(false);const request=lesson.requestFullscreen||lesson.webkitRequestFullscreen;if(request){try{await request.call(lesson);lesson.classList.add("native-fullscreen")}catch(err){}}setFullButton()}
function syncFs(){if(!fsEl()&&lesson.classList.contains("native-fullscreen")){lesson.classList.remove("native-fullscreen","theater");hideControls()}setFullButton()}
fullBtn.onclick=toggleFull;exitFullBtn.onclick=toggleFull;document.addEventListener("fullscreenchange",syncFs);document.addEventListener("webkitfullscreenchange",syncFs);lesson.onclick=e=>{if(!lesson.classList.contains("theater")||e.target.closest(".controls")||e.target.closest(".full-btn"))return;lesson.classList.contains("controls-visible")?hideControls():showControls(true)};paint();
</script>
