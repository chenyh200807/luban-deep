# DeepTutor 自托管 Prometheus 主配置（容器化 standalone）。
#
# 与 prometheus.scrape.example.yml 的区别：
#   - prometheus.scrape.example.yml 是"合并进你们已有 Prometheus"的可移植片段，
#     target 写 127.0.0.1:8001（宿主网络假设），credentials 走 ${VAR} 模板占位。
#   - 本文件是 docker-compose.observability.yml 拉起的 DeepTutor 自有 Prometheus
#     容器用的完整配置：target 走 compose 网络服务名 deeptutor:8001，token 走
#     credentials_file（secret 不入库）。
#
# 单一 authority：告警规则不在此重复定义。rule_files 直接复用 CI 校验过的
# prometheus.alerts.example.yml（compose 把它挂到 /etc/prometheus/alerts.yml）。
#
# ⚠️ 多 worker 少计：生产 UVICORN_WORKERS=2，/metrics/prometheus 读进程内单例，
# 每次 scrape 只命中其中一个 worker（共享监听 socket，无法分别寻址）。计数类指标
# 约 2× 少计且 counter 会在 worker 间跳变（rate() 不可靠）；per-worker 状态闸
# （熔断器/provider 阈值）可能漏报另一 worker 的开闸。这是已知限制，根治在独立的
# prometheus_client multiproc 迁移 PR（见 deployment/observability/README.md）。
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: deeptutor

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus 自监控（让 up / 规则评估健康可见）。
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: deeptutor
    metrics_path: /metrics/prometheus
    scheme: http
    authorization:
      type: Bearer
      # Secret 不入库：宿主 ./secrets/metrics_token 挂载到此路径，内容必须等于
      # DeepTutor 容器的 DEEPTUTOR_METRICS_TOKEN。
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets:
          - deeptutor:8001
