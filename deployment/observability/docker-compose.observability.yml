# DeepTutor 观测栈（Prometheus + Alertmanager）— 独立 compose，按需拉起，不进主发布。
#
# 拉起：
#   docker compose -f deployment/observability/docker-compose.observability.yml up -d
# 停止：
#   docker compose -f deployment/observability/docker-compose.observability.yml down
#
# 前置（见 README.md）：
#   1. 主 deeptutor compose 已 up（提供 deeptutor 容器 + deeptutor-network）。
#   2. 创建 secret 文件到 data/ 下（durable）。data/ 被 sync_to_aliyun.sh 的 EXCLUDES
#      排除，rsync --delete 不会删它——secret 因此能在每次全量发布中存活（旧位置
#      deployment/observability/secrets/ 在同步树内，会被 --delete 抹掉，已弃用）：
#        mkdir -p data/observability-secrets
#        printf '%s' "$DEEPTUTOR_METRICS_TOKEN" > data/observability-secrets/metrics_token
#        printf '%s' "$SMTP_PASSWORD"           > data/observability-secrets/smtp_password
#   3. 确认外部网络名与主 compose 实际创建的一致：
#        docker network ls | grep deeptutor   # 默认 <project>_deeptutor-network
#
# 端口只绑 loopback；公网必须经反代/TLS，不直接暴露 9090/9093。

services:
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: deeptutor-prometheus
    restart: unless-stopped
    # 共享 ECS 宿主内存吃紧（~3-4G 可用、无 swap）。我们指标基数很低，384m 对
    # Prometheus head + TSDB 足够，刻意压低以免在已饱和的宿主上触发 OOM killer。
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 单一 authority：告警规则复用 CI 校验过的 example 文件，不另起一份。
      - ./prometheus.alerts.example.yml:/etc/prometheus/alerts.yml:ro
      # Secret 落在 sync 排除的 data/ 下，全量发布 (rsync --delete) 删不掉 (见头部注释)。
      - ../../data/observability-secrets/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - deeptutor-network
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: deeptutor-alertmanager
    restart: unless-stopped
    # 同上，宿主内存吃紧；Alertmanager 占用很小，128m 足够。
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # 同上：secret 落在 sync 排除的 data/ 下，全量发布删不掉。
      - ../../data/observability-secrets/smtp_password:/etc/alertmanager/secrets/smtp_password:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - deeptutor-network

# 外部网络：由主 docker-compose.yml 创建。名字默认是 <compose-project>_deeptutor-network；
# Aliyun 上主 compose 在 /root/deeptutor → 项目名 deeptutor → 网络 deeptutor_deeptutor-network。
# 若 `docker network ls` 显示的名字不同，改这里的 name 或设 COMPOSE_PROJECT_NAME。
networks:
  deeptutor-network:
    external: true
    name: deeptutor_deeptutor-network

volumes:
  prometheus-data:
  alertmanager-data:
