# promtool test rules — behavioral regression for the alert rules.
#   promtool test rules deployment/observability/prometheus.alerts.test.yml
#
# `promtool check rules` only proves syntax; this proves each rule actually FIRES when its
# condition holds past its `for:` window and does NOT fire otherwise. rule_files reuses the
# CI-validated example file (single authority — rules are never duplicated here).
# promtool compares annotations exactly, so exp_annotations must mirror the rule text.
rule_files:
  - prometheus.alerts.example.yml

evaluation_interval: 1m

tests:
  # ---- DeepTutorNotReady (deeptutor_ready == 0, for 2m) ----
  - interval: 1m
    input_series:
      - series: "deeptutor_ready"
        values: "0 0 0"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorNotReady
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: DeepTutor readiness failed
              description: One or more DeepTutor readiness checks are failing.
  - interval: 1m
    input_series:
      - series: "deeptutor_ready"
        values: "1 1 1"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorNotReady
        exp_alerts: []

  # ---- DeepTutorServerErrors (increase(deeptutor_http_errors_total[5m]) > 5, for 5m) ----
  - interval: 1m
    input_series:
      - series: "deeptutor_http_errors_total"
        values: "0+10x15"  # +10/min => increase[5m] ~50 > 5, sustained
    alert_rule_test:
      - eval_time: 12m
        alertname: DeepTutorServerErrors
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: DeepTutor is returning 5xx responses
              description: DeepTutor emitted more than 5 HTTP 5xx responses in the last 5 minutes.
  - interval: 1m
    input_series:
      - series: "deeptutor_http_errors_total"
        values: "0x15"  # flat counter => increase 0, never > 5
    alert_rule_test:
      - eval_time: 12m
        alertname: DeepTutorServerErrors
        exp_alerts: []

  # ---- DeepTutorProviderThresholdExceeded (== 1, for 3m) ----
  - interval: 1m
    input_series:
      - series: 'deeptutor_provider_threshold_exceeded{provider="deepseek"}'
        values: "1 1 1 1"
    alert_rule_test:
      - eval_time: 3m
        alertname: DeepTutorProviderThresholdExceeded
        exp_alerts:
          - exp_labels: { severity: warning, provider: deepseek }
            exp_annotations:
              summary: Upstream provider error rate is above threshold
              description: At least one provider has exceeded the configured sliding-window error threshold.
  - interval: 1m
    input_series:
      - series: 'deeptutor_provider_threshold_exceeded{provider="deepseek"}'
        values: "0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: DeepTutorProviderThresholdExceeded
        exp_alerts: []

  # ---- DeepTutorCircuitBreakerOpen (== 1, for 1m) — the Step 2 OR-merge payoff ----
  - interval: 1m
    input_series:
      - series: 'deeptutor_circuit_breaker_open{provider="deepseek"}'
        values: "1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: DeepTutorCircuitBreakerOpen
        exp_alerts:
          - exp_labels: { severity: critical, provider: deepseek }
            exp_annotations:
              summary: DeepTutor circuit breaker is open
              description: A provider circuit breaker has opened and requests are being blocked.
  - interval: 1m
    input_series:
      - series: 'deeptutor_circuit_breaker_open{provider="deepseek"}'
        values: "0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: DeepTutorCircuitBreakerOpen
        exp_alerts: []

  # ---- Billing capture failures and authority violations ----
  - interval: 1m
    input_series:
      - series: 'deeptutor_billing_capture_total{status="failed",reason="capture_error",chargeable="yes"}'
        values: "0+1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorBillingCaptureError
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: DeepTutor billing capture failed
              description: At least one charge attempt or usage-meter write failed; inspect the canonical wallet ledger before retrying or adjusting balances.
  - interval: 1m
    input_series:
      - series: 'deeptutor_billing_capture_total{status="metered_not_charged",reason="billing_enforcement_disabled",chargeable="yes"}'
        values: "0+1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorBillingEnforcementDisabled
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: DeepTutor billing enforcement is disabled
              description: A production-shaped turn was metered without charging because billing enforcement is off; confirm an intentional maintenance window or restore enforcement.
  - interval: 1m
    input_series:
      - series: 'deeptutor_billing_capture_total{status="skipped",reason="missing_wallet",chargeable="yes"}'
        values: "0+1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorBillingContextIncomplete
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: DeepTutor billing context is incomplete
              description: A mini-program billing path reached terminal capture without wallet authority or visible content; inspect start-turn context propagation before assuming the turn is free.
  - interval: 1m
    input_series:
      - series: 'deeptutor_billing_capture_total{status="captured",reason="-",chargeable="no"}'
        values: "0+1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorNonChargeableCaptured
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: A non-chargeable response was captured
              description: Billing reported a wallet capture for output classified as non-chargeable; stop financial writes and inspect the turn and ledger authorities.

  # Every chargeable paid terminal outcome that is not captured is illegal.  Cover
  # the early skips explicitly; missing_context/wrong_source are only excluded when
  # the runtime truthfully labels their non-wallet path as chargeable="unknown".
  - interval: 1m
    input_series:
      - series: 'deeptutor_billing_capture_total{status="skipped",reason="missing_context",chargeable="yes"}'
        values: "0+1x5"
      - series: 'deeptutor_billing_capture_total{status="skipped",reason="wrong_source",chargeable="yes"}'
        values: "0+1x5"
      - series: 'deeptutor_billing_capture_total{status="skipped",reason="missing_wallet",chargeable="yes"}'
        values: "0+1x5"
      - series: 'deeptutor_billing_capture_total{status="skipped",reason="empty_content",chargeable="yes"}'
        values: "0+1x5"
      - series: 'deeptutor_billing_capture_total{status="released",reason="other",chargeable="yes"}'
        values: "0+1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorChargeableTurnNotCaptured
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: A chargeable turn reached a non-captured terminal state
              description: A paid mini-program turn ended without canonical wallet capture; stop treating billing as healthy and inspect context propagation, terminal classification, and the wallet ledger.
  - interval: 1m
    input_series:
      - series: 'deeptutor_billing_capture_total{status="skipped",reason="missing_context",chargeable="unknown"}'
        values: "0+1x5"
      - series: 'deeptutor_billing_capture_total{status="bypassed",reason="internal_qa_billing_bypass",chargeable="yes"}'
        values: "0+1x5"
      - series: 'deeptutor_billing_capture_total{status="bypassed",reason="eval_billing_bypass",chargeable="yes"}'
        values: "0+1x5"
      - series: 'deeptutor_billing_capture_total{status="metered_not_charged",reason="free_trial",chargeable="yes"}'
        values: "0+1x5"
      - series: 'deeptutor_billing_capture_total{status="captured",reason="-",chargeable="yes"}'
        values: "0+1x5"
      - series: 'deeptutor_billing_capture_total{status="released",reason="non_chargeable_assistant_content",chargeable="no"}'
        values: "0+1x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorChargeableTurnNotCaptured
        exp_alerts: []

  # A partial multi-worker restart lowers the merged counter. Do not misreport it
  # as a new chargeable event; fail closed with a dedicated telemetry-integrity alert.
  - interval: 1m
    input_series:
      - series: 'deeptutor_billing_capture_total{status="failed",reason="capture_error",chargeable="yes"}'
        values: "10 10 2 2 2"
      - series: 'deeptutor_billing_capture_total{status="metered_not_charged",reason="billing_enforcement_disabled",chargeable="yes"}'
        values: "10 10 2 2 2"
      - series: 'deeptutor_billing_capture_total{status="skipped",reason="missing_wallet",chargeable="yes"}'
        values: "10 10 2 2 2"
      - series: 'deeptutor_billing_capture_total{status="captured",reason="-",chargeable="no"}'
        values: "10 10 2 2 2"
    alert_rule_test:
      - eval_time: 4m
        alertname: DeepTutorBillingCaptureError
        exp_alerts: []
      - eval_time: 4m
        alertname: DeepTutorBillingEnforcementDisabled
        exp_alerts: []
      - eval_time: 4m
        alertname: DeepTutorBillingContextIncomplete
        exp_alerts: []
      - eval_time: 4m
        alertname: DeepTutorChargeableTurnNotCaptured
        exp_alerts: []
      - eval_time: 4m
        alertname: DeepTutorNonChargeableCaptured
        exp_alerts: []
      - eval_time: 4m
        alertname: DeepTutorBillingCounterReset
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Billing telemetry reset during the alert window
              description: A worker restart made the merged billing counter non-monotonic, so event increases are temporarily untrustworthy; verify worker health and audit the canonical wallet ledger for the affected window.

  # ---- Suspicious positive wallet requests; ledger remains applied authority ----
  - interval: 1m
    input_series:
      - series: 'deeptutor_wallet_mutation_requested_points_total{event_type="grant",direction="credit",cause="identity_merge",outcome="success"}'
        values: "0+100x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorSuspiciousWalletCredit
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: A suspicious wallet credit was requested
              description: An identity-merge/manual adjustment credit or unusually large signup bonus was requested; the canonical wallet ledger must be audited before treating it as applied.
  - interval: 1m
    input_series:
      - series: 'deeptutor_wallet_mutation_requested_points_total{event_type="grant",direction="credit",cause="purchase",outcome="success"}'
        values: "0+50000x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorSuspiciousWalletCredit
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'deeptutor_wallet_mutation_requested_points_total{event_type="grant",direction="credit",cause="identity_merge",outcome="success"}'
        values: "1000 1000 100 100 100"
    alert_rule_test:
      - eval_time: 4m
        alertname: DeepTutorSuspiciousWalletCredit
        exp_alerts: []
      - eval_time: 4m
        alertname: DeepTutorWalletCounterReset
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Wallet telemetry reset during the alert window
              description: A worker restart made the merged wallet counter non-monotonic, so requested-credit increases are temporarily untrustworthy; verify worker health and audit the canonical wallet ledger for the affected window.

  # ---- DeepTutorMetricsScrapeDown (up{job="deeptutor"} == 0, for 2m) ----
  - interval: 1m
    input_series:
      - series: 'up{job="deeptutor"}'
        values: "0 0 0"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorMetricsScrapeDown
        exp_alerts:
          - exp_labels: { severity: critical, job: deeptutor }
            exp_annotations:
              summary: DeepTutor metrics endpoint is unscrapeable
              description: Prometheus failed to scrape the deeptutor /metrics/prometheus target for 2m; all deeptutor alerts are blind until this recovers.
  - interval: 1m
    input_series:
      - series: 'up{job="deeptutor"}'
        values: "1 1 1"
    alert_rule_test:
      - eval_time: 2m
        alertname: DeepTutorMetricsScrapeDown
        exp_alerts: []

  # ---- AlertmanagerDown (up{job="alertmanager"} == 0, for 2m) ----
  - interval: 1m
    input_series:
      - series: 'up{job="alertmanager"}'
        values: "0 0 0"
    alert_rule_test:
      - eval_time: 2m
        alertname: AlertmanagerDown
        exp_alerts:
          - exp_labels: { severity: critical, job: alertmanager }
            exp_annotations:
              summary: Alertmanager is down
              description: Prometheus cannot scrape Alertmanager for 2m; alert notifications may be silently dropped.
