version: 1
source: deeptutor
description: DeepTutor runtime skill registry. This is a validation and discovery surface, not a router.
# AUTHORITY: This file is a validation/discovery surface only. It MUST NOT be imported by runtime code.
# SkillsLoader and question_lifecycle_skills are the only runtime skill-loading authorities.
skills:
