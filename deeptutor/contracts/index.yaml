# Batch A Task 1 — layered addendum on top of the learner_state and turn
# domains. Records authority / allowed event types / projection grammar /
# explicit forbidden anti-patterns introduced by the
# 2026-05-22 learning-state-inference transformation plan.
# Purely additive: no new domain, no new endpoint, no new ledger table.
learning_state_inference:
  authority: learner_memory_events.learning_evidence -> learning_synthesis -> learning_report_read_model
  allowed_event_type: learning_evidence
  allowed_evidence_sources:
    - construction_grading
    - conversation_synthesis
    - assessment_testset
    - first_run_diagnostic
  projections:
    - knowledge_state
    - ability_state
    - behavior_state
    - prescription
    - scoring_point_map
    - PersonalizationContextPack
    - today_prescription
  forbidden:
    - second learner memory table
    - frontend mastery derivation
    - recommendation authority outside training_intent / learning_report_read_model
    - compiled truth override of exact question / standard / textbook authority
    - new chat WebSocket route outside /api/v1/ws
    - LLM-fabricated scoring_point_hits bypassing audit.reconcile_grader_output
    - unregistered error_code in payload outside docs/contracts/error_code_registry.md
    - keyword-only rubric items rendered as "采分点" instead of "审题要点"
    - write-back into questions_bank.grading_rubric

# ---------------------------------------------------------------------------
# Control-plane single-writer allowlist (Task 1, fast-mode-orchestrator plan §14.A).
#
# Register-before-use baseline: every control-plane write-site that
# scripts/check_control_plane_writer_allowlist.py detects in the writer-map
# files must have a matching (field + writer_type + file + symbol) entry here.
# A new, unregistered writer turns the gate red. Task 1 only REGISTERS the
# current writers (canonical + competing + defensive); it does not converge
# authorities. Each competing writer carries allowed_role + remove_when
# pointing at the collapsing task (plan §14.A Task 2-5). The two reveal sinks
# are both registered (TutorBot canonical_writer, deep_question
# compat_projection demotion candidate). Dormant prospective arms
# (StreamEventType.ACK / stream.ack / first_useful_content) have zero live hits
# (the enum has no ACK member); the guard scans for them so a future contentful
# visible-frame writer is flagged on arrival.
control_plane_writers:
  - field: active_object
    writer_type: payload_assignment
    file: deeptutor/capabilities/deep_question.py
    symbol: run
    allowed_role: compat_projection
    reason: deep_question fabricated/competing turn-fact writer (demotion candidate).
    remove_when: Task 3 (deep_question reads canonical decision; fail-loud instead of fabricate).
  - field: is_correct
    writer_type: metadata_assignment
    file: deeptutor/capabilities/deep_question.py
    symbol: _apply_open_world_grading_state
    allowed_role: compat_projection
    reason: deep_question grading-state projection (clears/fills authority placeholders).
    remove_when: Task 3 (grading authority single writer).
  - field: is_correct
    writer_type: metadata_assignment
    file: deeptutor/capabilities/deep_question.py
    symbol: _build_submission_context
    allowed_role: compat_projection
    reason: deep_question grading-state projection (clears/fills authority placeholders).
    remove_when: Task 3 (grading authority single writer).
  - field: is_correct
    writer_type: metadata_assignment
    file: deeptutor/capabilities/deep_question.py
    symbol: _emit_grading_result
    allowed_role: compat_projection
    reason: deep_question grading-state projection (clears/fills authority placeholders).
    remove_when: Task 3 (grading authority single writer).
  - field: is_correct
    writer_type: metadata_assignment
    file: deeptutor/capabilities/deep_question.py
    symbol: _fill_missing_mcq_authority
    allowed_role: compat_projection
    reason: deep_question grading-state projection (clears/fills authority placeholders).
    remove_when: Task 3 (grading authority single writer).
  - field: question_followup_context
    writer_type: metadata_assignment
    file: deeptutor/capabilities/deep_question.py
    symbol: run
    allowed_role: compat_projection
    reason: deep_question fabricated/competing turn-fact writer (demotion candidate).
    remove_when: Task 3 (deep_question reads canonical decision; fail-loud instead of fabricate).
  - field: question_followup_context
    writer_type: payload_assignment
    file: deeptutor/capabilities/deep_question.py
    symbol: run
    allowed_role: compat_projection
    reason: deep_question fabricated/competing turn-fact writer (demotion candidate).
    remove_when: Task 3 (deep_question reads canonical decision; fail-loud instead of fabricate).
  - field: question_lifecycle_scene
    writer_type: metadata_assignment
    file: deeptutor/capabilities/deep_question.py
    symbol: run
    allowed_role: trace_projection
    reason: Mirrors canonical scene into trace_metadata for observability (reads canonical via project_question_lifecycle_scene_from_metadata; never derives one).
    remove_when: never
  - field: reveal_reference
    writer_type: reveal_kwarg
    file: deeptutor/capabilities/deep_question.py
    symbol: _coerce_question_bank_contexts
    allowed_role: value_projection
    reason: deep_question reveal kwarg site; the reveal decision is read from the single canonical authority resolve_reveal_decision (question_followup.py) — this only propagates that adjudicated value.
    remove_when: never
  - field: reveal_reference
    writer_type: reveal_kwarg
    file: deeptutor/capabilities/deep_question.py
