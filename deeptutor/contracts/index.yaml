  rag:
    summary: Grounding entry point, retrieval contract, exact-question, compiled teaching overlay, and authority semantics.
    runtime_metadata_contracts:
      - general_knowledge_context is a runtime-only compiled teaching overlay
        opt-in for TutorBot / Chat agent execution. Consumers must reuse
        deeptutor.services.compiled_knowledge.general_knowledge, emit only
        teaching-tier metadata, fail open on low confidence or active question
        context, and must not create a second RAG/KB/taxonomy/learner-memory
        authority or write canonical learner truth.
      - lecture_answer_method_context / luban_lecture_answer_method_context is
        a runtime-only lecture answer-method teaching overlay for high-fit
        construction-exam TutorBot questions. Consumers must reuse
        deeptutor.services.compiled_knowledge.lecture_answer_methods and the
        tracked all8 runtime_supply manifest, emit only teaching-tier metadata,
        fail open on low confidence/off-syllabus/active-question contexts, and
        must not create an answer-key, official-score, second RAG/KB/taxonomy,
        learner-memory authority, or canonical learner-truth write.
      - Evidence bundles are the canonical normalization boundary for provider
        source metadata. Provider pipelines may pass source-native fields, but
        user-facing consumers must read normalized document_id, source,
        authority, and subject from evidence_bundle/result sources instead of
        reinterpreting provider-specific aliases.
      - Exact-question authority is an identity judgement, not a relevance
        judgement (contracts/rag.md 32b). The question_exact_text /
        question_exact_vector / option-overlap probes only supply candidates;
        a candidate may mint a question_exact_* chapter only after the single
        falsifiable adjudicator exact_question_identity_corresponds confirms
        identity (normalized containment or >=0.90 ordered char coverage,
        plus the orthogonal calculation-identity invariant). Rejected
        candidates degrade to ordinary questions_bank retrieval rows carrying
        their real scores — no fabricated confidence floors — and the turn
        falls open to the main LLM. Domain tests live in
        tests/services/rag/test_supabase_strategy.py (identity adjudicator)
        and tests/services/rag/test_rag_pipelines.py (demotion/no-floor state).
