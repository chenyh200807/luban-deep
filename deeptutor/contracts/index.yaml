member_console_controls:
  account_deletion:
    path: /api/v1/bi/member/{user_id}/account
    authority: MemberConsoleService -> external_auth
    semantics:
      - BI account deletion is an audited high-risk admin write guarded by
        member_ops/high_risk and X-Idempotency-Key.
      - The control deletes external auth credentials and invalidates external
        auth sessions before marking the member account status as deleted.
      - Wallet ledger, learner-state, turn/session history, and BI audit rows
        are retained as historical records; deletion must not rewrite them.
      - Deleted members are hidden from the default member-ops list and may only
        be inspected through explicit deleted-status/audit paths.
  manual_membership_reversal:
    path: /api/v1/member/manual-purchase/reverse
    authority: MemberConsoleService -> wallet_ledger
    semantics:
      - Manual membership reversal is append-only; it must not delete or mutate the original purchase ledger row.
      - Only supreme_svip manual membership purchases can be reversed through this control.
      - The reversal writes a wallet refund ledger event with negative metadata.amount_cny so BI commerce revenue is netted by wallet_ledger.
      - The control is an audited admin write and requires X-Idempotency-Key.

mobile_http_read_models:
  billing_usage:
    path: /api/v1/billing/usage
    authority: wallet_snapshot + wallet_ledger_or_member_usage_meter
    semantics:
      - Wallet snapshot read failure returns status=degraded and no quota rows.
      - When billing enforcement is enabled, wallet ledger is the canonical commerce
        usage authority; ledger read failure must not make the whole usage read model
        unavailable, and the adapter returns status=ok with empty usage entries and
        the snapshot plan.
      - When billing enforcement is disabled for internal beta, MemberUsageMeter may
        provide the non-financial usage display source with charging_status=metered_not_charged;
        it must not mutate wallet balance or wallet ledger. The temporary default display
        budget is 450 turns for every member, configurable by DEEPTUTOR_INTERNAL_BETA_USAGE_LIMIT_TURNS;
        public display labels remain percentage-based rather than exposing remaining turn counts.
      - Usage windows are display read models only; they are not capability routing,
        request config, learner-state, or turn authority.

mobile_http_auth_controls:
  password_reset:
    path: /api/v1/auth/reset-password
    authority: MemberConsoleService -> external_auth
    semantics:
      - Account recovery is a public, rate-limited HTTP auth adapter, not a
        turn/session/capability entrypoint.
      - Request must prove username, registered phone, and SMS code before changing
        the external auth password.
      - Successful reset invalidates existing external auth sessions, consumes the
        SMS code, returns no token, and never auto-logs in.
      - Reset must not write learner summaries, learner memory events, profile,
        progress, goals, wallet, capability route state, or turn/session state.
  change_password:
    path: /api/v1/auth/change-password
    authority: MemberConsoleService -> external_auth
    semantics:
      - Password change is an authenticated, rate-limited HTTP auth adapter, not
        a turn/session/capability entrypoint.
      - Request must prove the current signed-in member and old password before
        changing the external auth password to the new password.
      - The route delegates password verification, hashing, and session
        invalidation to MemberConsoleService -> external_auth.
      - Successful change returns no token and never auto-logs in.
      - Change password must not write learner summaries, learner memory events,
        profile, progress, goals, wallet, capability route state, or
        turn/session state.
  delete_account:
    path: /api/v1/auth/delete-account
    authority: MemberConsoleService -> external_auth
    semantics:
      - Self account cancellation is an authenticated, rate-limited HTTP auth
        adapter, not a turn/session/capability entrypoint.
      - Request must prove the current signed-in member and current password
        before deleting external auth credentials.
      - Successful cancellation invalidates existing external auth sessions,
        returns no token, and never auto-logs in.
      - Wallet ledger, learner-state, turn/session history, and BI audit rows
        are retained as historical records; cancellation must not rewrite them.
  wechat_phone_login:
    path: /api/v1/wechat/mp/login
    authority: MemberConsoleService.login_with_wechat_phone
    semantics:
      - Quick login is a public, rate-limited HTTP auth adapter that requires both
        wx.login code and getPhoneNumber phone_code.
      - The route must fail closed when phone_code is absent; wx.login code alone
        must not issue a full learner token.
      - The returned token is minted only after WeChat phone authorization has
        been exchanged and bound to the canonical member identity.
      - The mini-program primary quick-login button must use getPhoneNumber and
        keep audit-safe copy that does not expose WeChat wording in the UI.

bi_admin_rbac:
  authority: deeptutor/services/member_console/rbac.py + admin_store.py (data/user/bi_admins.json) + service.can_access (端点 enforce)
  semantics:
    - BI 后台权限的唯一定义来源是 rbac.py 的角色权限矩阵；端点与前端都从这里派生，
      不得各自硬编码权限判断。
    - 4 个角色 (super_admin/admin/operator/analyst) × 5 tab × 4 操作 (view/export/write/high_risk)。
    - super_admin 角色恒为全权且可管理权限 (LOCKED_ROLES)，不可被编辑/降级/移除，
      env 引导管理员 (DEEPTUTOR_ADMIN_USER_IDS) 恒为 super_admin，防止超管锁死自己。
    - 超管可编辑非锁定角色的权限矩阵 (角色级，影响所有该角色管理员)，并可对单个管理员
      设置 per-user 权限覆盖 (精确到人)。生效权限 = 角色权限[可编辑] 叠加 per-user 覆盖。
    - 端点 enforce：BI 数据端点按 service.can_access 逐 (tab, action) 裁决 (require_bi_permission)，
      唯一授权依据是生效权限矩阵，不用 is_admin 布尔旁路；管理端点要求 super_admin
      (can_manage_permissions)。super_admin/admin 默认全权，admin 被收权后端点立即拒绝。
    - 授权 fail-closed：持久化中出现非法/被篡改 role 时视为非管理员 (不回落 admin)；
      service 写方法 (set_admin_role/set_role_permissions/set_user_permission_overrides/
      remove_admin_user) 自校验 actor 为 super_admin (PermissionError)，是 HTTP gate 之外的纵深。
    - 所有权限变更 (增删管理员、改角色、编辑角色权限、个人覆盖) 写入【独立 append-only
      审计文件 bi_admin_audit.jsonl】(O_APPEND 原子追加、永不重写历史，防止被刷掉)；
      bi_admins.json 内 legacy 审计仍合并读取。
    - 权限存储是文件持久化 (bind-mount)，非 turn/session/capability/learner-state authority。

domains:
  turn:
    summary: Unified turn, stream, replay, session, trace boundary, and mobile assessment HTTP bridges.
    runtime_metadata_contracts:
      - general_knowledge_context is a runtime-only TutorBot shadow opt-in. When
        present in start-turn config, or in the mobile HTTP bootstrap top-level
        compatibility field that is normalized into that config, turn runtime
        must project it into UnifiedContext.metadata for the TutorBot compiled
        teaching-context service; it must not create a second knowledge
        authority, mutate canonical learner truth, or open any WebSocket route
        other than /api/v1/ws.
      - content_truth_low_confidence_claims is an OBSERVE-ONLY ② content-truth
        review-loop passthrough. When the TutorBot loop writes a regulation code
        that this turn's standard recall could not verify, it does NOT suppress
        output (owner principle — always answer plus honest hedge); it stamps the low-confidence
        claims into runtime_metadata, and the multi-hop observability pipeline
        forwards them (plus content_truth_guard_applied) verbatim into the
        TurnEventLog observation event via these hops — manager bridges runtime_metadata into
        trace/merged/session metadata, the tutorbot capability exports them onto
        the result event, and turn runtime's _summarize_assistant_events plus the
        terminal observation allow-list carry them through. Every hop is a fixed
        allow-list mirroring the degraded_* flags. This is a one-way flag into the
        single event sink for the OFFLINE review agent (content_truth_review_queue);
        it must not become a second runtime decider, gate output, or create a
        second truth source — truth stays with this-turn standard recall (runtime)
        and textbook arbitration (offline).
    contract_files:
      - CONTRACT.md
      - contracts/turn.md
      - contracts/learning-report.md
      - docs/zh/guide/unified-turn-contract.md
      - deeptutor/contracts/unified_turn.py
