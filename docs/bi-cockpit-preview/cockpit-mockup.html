<style>
  :root{
    --bg:#150f0b; --panel-a:rgba(40,28,20,.62); --panel-b:rgba(28,19,13,.55);
    --text:#F1E9E1; --muted:#A99B8C; --faint:#6E5F52;
    --terra:#E8915A; --amber:#F2B85C; --gold:#E6CB86; --clay:#D86C57; --sage:#9DB89C; --rose:#E0A39A; --bronze:#C58E5A; --teal:#7FA8AE;
    --line:rgba(212,140,90,.18); --glow:rgba(232,150,80,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1440px;margin:0 auto;padding:22px 26px 60px;position:relative;overflow:hidden}
  /* 大屏背景 */
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(212,150,100,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(212,150,100,.05) 1px,transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 35%,transparent 100%);
            mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 35%,transparent 100%)}
  .bg-glow1{position:fixed;top:-180px;left:50%;width:120%;height:340px;transform:translateX(-50%);z-index:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(232,145,90,.16),transparent 60%)}
  .wrap>*{position:relative;z-index:1}
  /* header */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.22em;color:rgba(232,145,90,.9);text-transform:uppercase;display:flex;align-items:center;gap:8px}
  h1{margin:6px 0 0;font-size:27px;font-weight:900}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(232,145,90,.3);background:rgba(232,145,90,.1);color:#F0A878;font-size:11px;font-weight:800;border-radius:999px;padding:6px 12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--terra);box-shadow:0 0 0 0 rgba(232,145,90,.6);animation:ping 1.6s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(232,145,90,.5)}70%{box-shadow:0 0 0 7px rgba(232,145,90,0)}100%{box-shadow:0 0 0 0 rgba(232,145,90,0)}}
  /* 切换器 */
  .switcher{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .seg{cursor:pointer;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:linear-gradient(150deg,var(--panel-a),var(--panel-b));transition:.18s;text-align:left}
  .seg:hover{border-color:rgba(232,145,90,.4)}
  .seg.active{border-color:rgba(232,145,90,.55);box-shadow:0 0 0 1px rgba(232,145,90,.25),0 18px 40px -18px rgba(0,0,0,.7)}
  .seg .t{display:flex;align-items:center;justify-content:space-between}
  .seg .name{font-size:14px;font-weight:800}
  .seg .arrow{color:var(--faint)}
  .seg.active .arrow{color:var(--terra)}
  .seg .num{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:8px;color:#F0A878;text-shadow:0 0 18px rgba(232,145,90,.4)}
  .seg .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .seg.active .num{color:var(--amber);text-shadow:0 0 20px rgba(242,184,92,.5)}
  /* KPI */
  .kpis{display:grid;gap:12px;margin-bottom:18px}
  .kpi{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(150deg,var(--panel-a),var(--panel-b))}
  .kpi .lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .kpi .val{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:6px}
  .kpi .unit{font-size:12px;font-weight:700;color:var(--muted);margin-left:3px}
  .kpi .sub{font-size:11px;color:var(--faint);margin-top:4px}
  .kpi .blob{position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;filter:blur(20px);opacity:.4}
  /* 区块标题 */
  .sec{display:flex;align-items:center;gap:9px;margin:20px 2px 12px}
  .sec .bar{width:4px;height:14px;border-radius:3px;background:linear-gradient(#F0A878,#D4734B);box-shadow:0 0 8px rgba(232,145,90,.6)}
  .sec h3{margin:0;font-size:14px;font-weight:800}
  /* 面板栅格 */
  .grid{display:grid;gap:14px}
  .panel{position:relative;border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(160deg,var(--panel-a),var(--panel-b));backdrop-filter:blur(8px)}
  .panel.glow{border-color:rgba(232,145,90,.4);box-shadow:0 0 0 1px rgba(232,145,90,.16),0 16px 48px -16px rgba(0,0,0,.7)}
  .panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .panel .pt{font-size:13px;font-weight:800}
  .panel .phint{font-size:11px;color:var(--faint)}
  .panel .tag{font-size:10px;color:var(--terra);border:1px solid rgba(232,145,90,.3);border-radius:999px;padding:2px 7px;cursor:pointer}
  .chart{width:100%}
  .corner{position:absolute;width:11px;height:11px;border-color:rgba(232,145,90,.55)}
  .corner.tl{left:6px;top:6px;border-left:1px solid;border-top:1px solid;border-top-left-radius:4px}
  .corner.tr{right:6px;top:6px;border-right:1px solid;border-top:1px solid;border-top-right-radius:4px}
  .corner.bl{left:6px;bottom:6px;border-left:1px solid;border-bottom:1px solid;border-bottom-left-radius:4px}
  .corner.br{right:6px;bottom:6px;border-right:1px solid;border-bottom:1px solid;border-bottom-right-radius:4px}
  .view{display:none}
  .view.active{display:block}
  /* 下钻抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(5,4,3,.6);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:.2s}
  .drawer-mask.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,92vw);z-index:50;background:linear-gradient(160deg,#1c130d,#130d09);border-left:1px solid rgba(232,145,90,.3);box-shadow:-20px 0 60px rgba(0,0,0,.6);transform:translateX(100%);transition:.24s;display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .drawer .dh .dt{font-size:15px;font-weight:800}
  .drawer .dh .ds{font-size:11px;color:var(--muted);margin-top:2px}
  .drawer .x{cursor:pointer;color:var(--muted);border:1px solid var(--line);border-radius:10px;width:30px;height:30px;display:grid;place-items:center}
  .drawer .body{padding:12px 14px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid rgba(212,140,90,.12)}
  th{color:var(--muted);font-weight:700;font-size:11px;position:sticky;top:0;background:#1a120c}
  td .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  tr.clickable{cursor:pointer;transition:.12s}
  tr.clickable:hover td{background:rgba(232,145,90,.08)}
  .back{cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#F0A878;font-size:12px;font-weight:700;margin-bottom:12px}
  .rec-name{font-size:18px;font-weight:900;margin:2px 0 2px}
  .rec-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line)}
  .rec-sec{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--terra);margin:16px 0 8px;display:flex;align-items:center;gap:7px}
  .rec-sec::before{content:'';width:3px;height:11px;background:linear-gradient(#F0A878,#D4734B);border-radius:2px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:12.5px}
  .kv .k{color:var(--muted)}
  .kv .v{color:var(--text);font-weight:600}
  .ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
  .rt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(232,145,90,.05)}
  .rt .rn{font-size:11px;color:var(--muted)}
  .rt .rv{font-size:18px;font-weight:900;color:#F4CE86}
  .quote{border-left:2px solid rgba(232,145,90,.5);padding:4px 0 4px 12px;color:var(--text);font-size:12.5px;margin:6px 0;line-height:1.6}
  .note{margin-top:26px;font-size:11px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px;line-height:1.7}
  @media(max-width:920px){.switcher{grid-template-columns:1fr}}
</style>
</head>

/* ============ ECharts 暖色主题 ============ */
const SERIES=['#E8915A','#F2B85C','#E6CB86','#D86C57','#9DB89C','#E0A39A','#C58E5A','#7FA8AE']
const C={text:'#F1E9E1',muted:'#A99B8C',faint:'#6E5F52',grid:'rgba(212,150,100,.09)',panel:'#211710'}
const FONT='"Inter",system-ui,"PingFang SC","Microsoft YaHei",sans-serif'
function aRGBA(hex,a){const h=hex.replace('#','');return`rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`}
function vGrad(f,t){return{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:f},{offset:1,color:t}]}}
const TIP={backgroundColor:'rgba(28,19,13,.92)',borderColor:'rgba(232,150,80,.45)',borderWidth:1,textStyle:{color:C.text,fontSize:12},extraCssText:'backdrop-filter:blur(8px);border-radius:10px'}
const fmt=n=>new Intl.NumberFormat('en-US').format(Math.round(n))

function optDonut(rows,centerLab,centerVal){
  return{color:SERIES,tooltip:{...TIP,trigger:'item',formatter:p=>`${p.name}<br/><b>${fmt(p.value)}</b> · ${p.percent}%`},
    series:[{type:'pie',radius:['60%','85%'],center:['50%','50%'],padAngle:3,
      itemStyle:{borderRadius:6,borderColor:C.panel,borderWidth:2,shadowBlur:14,shadowColor:'rgba(0,0,0,.4)'},
      label:{show:false},emphasis:{scale:true,scaleSize:6},
      data:rows.map(r=>({name:r[0],value:r[1]}))}],
    graphic:centerVal?[{type:'text',left:'center',top:'42%',style:{text:centerVal,fill:C.text,fontSize:24,fontWeight:800,fontFamily:FONT}},
      {type:'text',left:'center',top:'57%',style:{text:centerLab||'',fill:C.muted,fontSize:11,fontFamily:FONT}}]:null}
}
function optBar(rows,color){
  color=color||SERIES[0];const s=[...rows].sort((a,b)=>a[1]-b[1])
  return{grid:{left:4,right:38,top:8,bottom:4,containLabel:true},tooltip:{...TIP,trigger:'axis',axisPointer:{type:'shadow'}},
    xAxis:{type:'value',show:false,max:'dataMax'},
    yAxis:{type:'category',data:s.map(r=>r[0]),axisLine:{show:false},axisTick:{show:false},axisLabel:{color:C.muted,fontSize:11,fontFamily:FONT,width:96,overflow:'truncate'}},
    series:[{type:'bar',barWidth:12,itemStyle:{borderRadius:[0,6,6,0],color:vGrad(aRGBA(color,.35),color),shadowBlur:10,shadowColor:aRGBA(color,.45)},
      label:{show:true,position:'right',color:C.text,fontSize:11,fontWeight:700,fontFamily:FONT,formatter:p=>fmt(p.value)},data:s.map(r=>r[1])}]}
}
function optGauge(val,lab,suffix,color){
  color=color||'#E8915A';return{series:[{type:'gauge',startAngle:220,endAngle:-40,radius:'92%',center:['50%','54%'],
    progress:{show:true,width:12,roundCap:true,itemStyle:{color:vGrad(aRGBA(color,.4),color),shadowBlur:16,shadowColor:aRGBA(color,.6)}},
    axisLine:{lineStyle:{width:12,color:[[1,aRGBA(color,.12)]]}},pointer:{show:false},axisTick:{show:false},splitLine:{show:false},axisLabel:{show:false},anchor:{show:false},
    title:{show:!!lab,offsetCenter:[0,'34%'],color:C.muted,fontSize:11,fontFamily:FONT},
    detail:{offsetCenter:[0,'-2%'],formatter:v=>Math.round(v)+(suffix||''),color:C.text,fontSize:26,fontWeight:800,fontFamily:FONT},
    data:[{value:val,name:lab||''}]}]}
}
function optRadar(rows,color){
  color=color||'#A78B6A';const mx=Math.max(...rows.map(r=>r[1]))
  return{tooltip:{...TIP},radar:{indicator:rows.map(r=>({name:r[0],max:Math.ceil(mx)})),radius:'66%',center:['50%','54%'],splitNumber:4,
    axisName:{color:C.muted,fontSize:10,fontFamily:FONT},splitLine:{lineStyle:{color:C.grid}},
    splitArea:{areaStyle:{color:['rgba(232,145,90,.03)','rgba(232,145,90,.06)']}},axisLine:{lineStyle:{color:C.grid}}},
    series:[{type:'radar',symbol:'circle',symbolSize:4,lineStyle:{color,width:2,shadowBlur:10,shadowColor:aRGBA(color,.6)},
      areaStyle:{color:aRGBA(color,.22)},itemStyle:{color},data:[{value:rows.map(r=>r[1])}]}]}
}
function optTrend(rows,color){
  color=color||'#E8915A';return{grid:{left:6,right:12,top:16,bottom:4,containLabel:true},tooltip:{...TIP,trigger:'axis'},
    xAxis:{type:'category',boundaryGap:false,data:rows.map(r=>r[0]),axisLine:{lineStyle:{color:C.grid}},axisTick:{show:false},axisLabel:{color:C.faint,fontSize:10,fontFamily:FONT}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:C.grid}},axisLabel:{color:C.faint,fontSize:10,fontFamily:FONT}},
    series:[{type:'line',smooth:true,showSymbol:false,lineStyle:{color,width:2.5,shadowBlur:12,shadowColor:aRGBA(color,.5)},
      areaStyle:{color:vGrad(aRGBA(color,.32),aRGBA(color,.01))},data:rows.map(r=>r[1])}]}
}
function optNps(p,pa,d){
  return{grid:{left:0,right:0,top:10,bottom:10},tooltip:{...TIP,trigger:'axis',axisPointer:{type:'shadow'}},
    xAxis:{type:'value',show:false},yAxis:{type:'category',show:false,data:['NPS']},
    series:[{name:'推荐者',type:'bar',stack:'n',barWidth:20,itemStyle:{color:'#86B97A',borderRadius:[6,0,0,6]},data:[p]},
      {name:'被动者',type:'bar',stack:'n',barWidth:20,itemStyle:{color:'#F2B85C'},data:[pa]},
      {name:'贬损者',type:'bar',stack:'n',barWidth:20,itemStyle:{color:'#D44A3C',borderRadius:[0,6,6,0]},data:[d]}]}
}

/* ============ DOM 构建 ============ */
const charts=[]
function kpi(lab,val,unit,sub,col){
  const glow={terra:'rgba(232,145,90,.5)',amber:'rgba(242,184,92,.5)',sage:'rgba(134,185,122,.5)',rose:'rgba(216,108,87,.5)',gold:'rgba(230,203,134,.5)',teal:'rgba(127,168,174,.5)'}[col]||'rgba(232,145,90,.5)'
  const txt={terra:'#F0A878',amber:'#F4CE86',sage:'#A6C99A',rose:'#E89A8E',gold:'#EAD79A',teal:'#A8CBD0'}[col]||'#F0A878'
  return`<div class="kpi"><div class="blob" style="background:${glow}"></div>
    <div class="lab">${lab}</div><div class="val" style="color:${txt};text-shadow:0 0 18px ${glow}">${val}${unit?'<span class="unit">'+unit+'</span>':''}</div>
    <div class="sub">${sub||''}</div></div>`
}
function panel(id,title,hint,glow,tag){
  return`<div class="panel${glow?' glow':''}"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="ph"><div><div class="pt">${title}</div>${hint?'<div class="phint">'+hint+'</div>':''}</div>${tag?'<span class="tag" data-mod="'+tag+'">明细 ›</span>':''}</div>
    <div class="chart" id="${id}" style="height:${arguments[5]||210}px"></div></div>`
}
function mkChart(id,opt,mod){
  window.__echartsReady.then(()=>{
    if(!window.echarts)return
    const el=document.getElementById(id);if(!el)return
    const ch=echarts.init(el);ch.setOption(opt);charts.push(ch)
    if(mod)ch.on('click',p=>openDrawer(mod,p.name))
  })
}

/* ============ 切换器 + 抽屉 ============ */
let current='feedback'
function renderSwitcher(){
  document.getElementById('switcher').innerHTML=MODS.map(m=>
    `<div class="seg${m.key===current?' active':''}" data-k="${m.key}">
      <div class="t"><span class="name">${m.name}</span><span class="arrow">${m.key===current?'● 当前':'›'}</span></div>
      <div class="num">${fmt(m.num)}</div><div class="sub">${m.sub}</div></div>`).join('')
  document.querySelectorAll('.seg').forEach(el=>el.onclick=()=>switchTo(el.dataset.k))
}
function switchTo(k){
  current=k;
  ['feedback','invite','luban'].forEach(v=>document.getElementById('view-'+v).classList.toggle('active',v===k))
  document.getElementById('viewTitle').textContent=TITLE[k]
  renderSwitcher()
  setTimeout(()=>charts.forEach(c=>{try{c.resize()}catch(e){}}),60)
}
const BADGE={terra:'background:rgba(232,145,90,.16);color:#F0A878',amber:'background:rgba(242,184,92,.16);color:#F4CE86',sage:'background:rgba(134,185,122,.18);color:#A6C99A',rose:'background:rgba(216,108,87,.16);color:#E89A8E',danger:'background:rgba(212,74,60,.18);color:#E89A8E',warn:'background:rgba(242,184,92,.16);color:#F4CE86'}
function openDrawer(mod,dim){
  document.getElementById('drawerTitle').textContent=MODS.find(m=>m.key===mod).name+' · 明细'
  document.getElementById('drawerSub').textContent=dim?('下钻维度：'+dim+'（按该维度过滤；点任一行看单个用户）'):'点任一行看单个用户详情'
  const head=ROW_HEAD[mod],rows=SAMPLE_ROWS[mod]
  document.getElementById('drawerBody').innerHTML=
    `<table><thead><tr>${head.map(h=>'<th>'+h+'</th>').join('')}</tr></thead>
     <tbody>${rows.map(r=>`<tr class="clickable" onclick="openRecord('${mod}','${r[0]}')">`+r.map((c,i)=>'<td>'+(i===2&&mod==='feedback'?'<span class="chip" style="'+(c==='赞'?BADGE.sage:c==='踩'?BADGE.danger:'background:rgba(169,155,140,.18);color:#A99B8C')+'">'+c+'</span>':c)+'</td>').join('')+'</tr>').join('')}</tbody></table>
     <p style="color:var(--faint);font-size:11px;margin-top:14px">↑ 真实面板=现有 BiDataTable（状态/来源/owner 筛选、导出）。<b>点任一行 → 单个用户全字段详情</b>（下方演示）。</p>`
  showDrawer()
}
function kv(obj){return`<div class="kv">${Object.entries(obj).map(([k,v])=>`<span class="k">${k}</span><span class="v">${v}</span>`).join('')}</div>`}
function openRecord(mod,id){
  const d=DETAIL[mod];if(!d){openDrawer(mod);return}
  const name=mod==='invite'?('王** · '+id):mod==='luban'?('回访 '+id):('反馈 '+id)
  let html=`<div class="back" onclick="openDrawer('${mod}')">‹ 返回明细表</div>
    <div class="rec-name">${name}</div>
    <div class="rec-badges">${d.badges.map(b=>`<span class="badge" style="${BADGE[b[1]]}">${b[0]}</span>`).join('')}</div>`
  for(const [label,obj] of d.groups){html+=`<div class="rec-sec">${label}</div>${kv(obj)}`}
  if(d.ratings){html+=`<div class="rec-sec">功能体验评分（满分 5）</div><div class="ratings">${d.ratings.map(r=>`<div class="rt"><div class="rn">${r[0]}</div><div class="rv">${r[1]}</div></div>`).join('')}</div>`}
  if(d.quotes){html+=`<div class="rec-sec">主观反馈</div>${d.quotes.map(q=>`<div class="quote"><b style="color:var(--muted);font-weight:700">${q[0]}：</b>${q[1]}</div>`).join('')}`}
  html+=`<p style="color:var(--faint);font-size:11px;margin-top:16px">↑ 真实面板这里是 ${mod==='invite'?'InviteApplicationDetailPanel（可改状态/写运营备注）':mod==='luban'?'LubanFeedbackDetailPanel（含功能评分/建议/留资）':'FeedbackDetailPanel（含分诊操作/终端上下文）'}，字段取自单条真实记录。</p>`
  document.getElementById('drawerTitle').textContent=MODS.find(m=>m.key===mod).name+' · 单条详情'
  document.getElementById('drawerSub').textContent='第四级下钻 · 单个用户'
  document.getElementById('drawerBody').innerHTML=html
  showDrawer()
}
function showDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('mask').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('mask').classList.remove('open')}

document.getElementById('note').innerHTML=
  '※ 这是<b>信息架构原型</b>：数据为符合线上真实 payload 结构的样例（上线时换成 getBiFeedback / getBiInviteTestStats / getBiLubanFeedbackStats 真实读模型即可，结构一致）。'+
  '交互模型：顶部三按钮切换模块（只展开当前模块）→ 点任意图表打开右侧明细抽屉 → 点明细行打开单条详情。配色为已确认的暖色品牌驾驶舱。'

window.__echartsReady.then(()=>{ renderSwitcher(); renderFeedback(); renderInvite(); renderLuban() })
window.addEventListener('resize',()=>charts.forEach(c=>{try{c.resize()}catch(e){}}))
</script>
